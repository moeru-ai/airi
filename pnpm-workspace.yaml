catalogMode: prefer
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@moeru/*'
  - '@proj-airi/*'
  - '@vishot/*'
  - '@xsai/*'
  - '@xsai-apple-speech/*'
  - '@xsai-ext/*'
  - '@xsai-transformers/*'
  - xsschema

shellEmulator: true
packages:
  - packages/**
  - plugins/**
  - integrations/**
  - services/**
  - examples/**
  - docs/**
  - engines/**
  - apps/**
  - server/**
  - '!**/dist/**'

