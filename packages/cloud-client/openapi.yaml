swagger: "2.0"
info:
  title: api/proto/cloud/v1/announcement.proto
  version: version not set
tags:
  - name: AnnouncementService
  - name: InboxService
  - name: WalletService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/announcements:
    get:
      operationId: AnnouncementService_ListAnnouncements
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAnnouncementsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: client
          description: 'A concrete client: web, desktop, or mobile.'
          in: query
          required: false
          type: string
        - name: locale
          description: A language tag. Selection uses exact locale, base language, then English.
          in: query
          required: false
          type: string
        - name: limit
          description: Zero uses 20. Maximum 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - AnnouncementService
  /v1/inbox:
    get:
      operationId: InboxService_ListInboxMessages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListInboxMessagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: limit
          description: Zero uses 20. Maximum 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: cursor
          description: Empty for the first page, else next_cursor of the previous page.
          in: query
          required: false
          type: string
      tags:
        - InboxService
  /v1/inbox/read-all:
    post:
      operationId: InboxService_MarkAllInboxMessagesRead
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1MarkAllInboxMessagesReadResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - InboxService
  /v1/inbox/unread-count:
    get:
      operationId: InboxService_GetInboxUnreadCount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1InboxUnreadCount'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - InboxService
  /v1/inbox/{id}/read:
    post:
      operationId: InboxService_MarkInboxMessageRead
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1MarkInboxMessageReadResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          in: path
          required: true
          type: string
      tags:
        - InboxService
  /v1/wallet:
    get:
      operationId: WalletService_GetWallet
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Wallet'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - WalletService
  /v1/wallet/transactions:
    get:
      operationId: WalletService_ListWalletTransactions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListWalletTransactionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - WalletService
definitions:
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      Represents a JSON `null`.

      `NullValue` is a sentinel, using an enum with only one value to represent
      the null value for the `Value` type union.

      A field of type `NullValue` with any value other than `0` is considered
      invalid. Most ProtoJSON serializers will emit a Value with a `null_value` set
      as a JSON `null` regardless of the integer value, and so will round trip to
      a `0` value.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1Announcement:
    type: object
    properties:
      id:
        type: string
      locale:
        type: string
      title:
        type: string
      body:
        type: string
        description: Plain text. Never render this value as HTML.
      actionLabel:
        type: string
      actionUrl:
        type: string
        description: Empty or an absolute HTTPS URL.
      priority:
        type: integer
        format: int32
      startsAt:
        type: string
      endsAt:
        type: string
        description: Empty means no expiry. The end time is exclusive.
      coverUrl:
        type: string
        description: Empty or a Cloud-relative path. Reading checks publication before redirecting.
      layout:
        type: string
        description: 'Operator-selected template: portrait shows text beside the cover; landscape reveals text on hover.'
  v1InboxMessage:
    type: object
    properties:
      id:
        type: string
      kind:
        type: string
        description: Clients render a known kind through i18n and skip an unknown kind.
      params:
        type: object
      readAt:
        type: string
        description: Empty means unread.
      createdAt:
        type: string
  v1InboxUnreadCount:
    type: object
    properties:
      unread:
        type: integer
        format: int32
  v1ListAnnouncementsResponse:
    type: object
    properties:
      announcements:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Announcement'
  v1ListInboxMessagesResponse:
    type: object
    properties:
      messages:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1InboxMessage'
        description: Newest first, from the last 90 days.
      nextCursor:
        type: string
        description: Empty on the last page.
  v1ListWalletTransactionsResponse:
    type: object
    properties:
      entries:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1WalletTransaction'
      hasMore:
        type: boolean
  v1MarkAllInboxMessagesReadResponse:
    type: object
    properties:
      marked:
        type: integer
        format: int32
  v1MarkInboxMessageReadResponse:
    type: object
  v1Wallet:
    type: object
    properties:
      userId:
        type: string
      flux:
        type: string
        format: int64
  v1WalletTransaction:
    type: object
    properties:
      id:
        type: string
      type:
        type: string
      amount:
        type: string
        format: int64
      description:
        type: string
      metadata:
        type: object
      createdAt:
        type: string
