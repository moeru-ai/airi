devtools:
  title: 开发者选项
  pages:
    context-flow:
      title: 上下文流
    presence-bubble:
      title: 状态气泡
      description: 从这里驱动角色头顶的气泡，效果显示在主窗口
      override:
        title: 由此处驱动气泡
        description: 关闭时，除非有对话回合正在进行，舞台不显示气泡。
      thinking:
        title: 思考中
        description: 显示三个点。优先级高于未读数量。
      unread:
        title: 未读消息
        description: 在头部旁以气泡显示，内含提示标记和数量。
      main-window-note: 改动会即时反映在 AIRI 主窗口。
    live2d-ambient-light:
      title: Live2D 环境光
      description: 调整屏幕采样和 Live2D 彩色光照着色器
      controls:
        title: 光源与输出
      enabled:
        title: 环境光
        description: 将环境光滤镜应用到当前 Live2D 模型。
      source:
        title: 光源
        options:
          screen-capture: 屏幕捕获
          forced-color: 指定颜色
      mode:
        title: 光照模式
        options:
          window-gradient: 窗口渐变
          global: 全局环境光
      forced-color:
        title: 测试颜色
        description: 直接应用此颜色，无需捕获屏幕。
      strength:
        title: 光照强度
        description: 设置整体效果强度。1 为预设效果，最高可设为 3，以增强光线包裹和轮廓逆光。
      squint:
        title: 亮度突变时眯眼
        description: 当屏幕变亮的速度超过角色的适应速度时眯眼。屏幕持续明亮时，眼睛保持睁开。设为 0 可关闭此功能。
      main-window-note: 改动会即时反映在 AIRI 主窗口。
      diagnostics:
        title: 捕获诊断
        waiting: 正在等待 AIRI 主窗口的诊断信息。
        status:
          disabled: 已禁用
          starting: 正在启动
          capturing: 正在捕获
          forced-color: 指定颜色
          error: 错误
        capture:
          title: 捕获状态
          description: 查看所选显示器、捕获尺寸和排除区域坐标。
          display: 显示器与边界
          video-size: 源视频
          sample-size: 采样帧
          window-bounds: AIRI 窗口边界
          excluded-region: 排除区域
          exposure: 屏幕曝光
          behind-luminance: 角色背后的亮度
          updated: 上次更新
        preview:
          title: 缩小后的捕获画面
          description: 红色矩形标记 AIRI 窗口，虚线矩形标记光照图覆盖的区域。
          unavailable: 暂无捕获帧。
        pixels:
          title: 像素筛选
          total: 总计
          accepted: 已采纳
          excluded: 已绘制
          transparent: 透明
          see-through: 可透视
        maps:
          title: 光照图
          window: 每张图覆盖 AIRI 窗口，并向四周各延伸半个窗口。轮廓线标记窗口位置。
          unavailable: 暂无环境数据。
          target: 实测
          applied: 平滑后应用
          surround:
            title: 周边光照图
            description: 对窗口周围及背后的屏幕内容进行大范围模糊，保留光线的颜色和入射方向。
          contact:
            title: 接触光照图
            description: 对相同内容进行小范围模糊，用于驱动光线包裹和逆光轮廓。
      sampling:
        title: 屏幕采样
        capture-interval:
          title: 捕获间隔
          description: 设置屏幕采样的时间间隔，捕获流会按此频率运行。
        response-time:
          title: 响应时间
          description: 设置采样颜色适应屏幕变化的速度。
        sample-width:
          title: 采样尺寸
          description: 设置缩小后捕获帧的宽度。更宽的画面能保留更多光照细节，高度会按显示器比例调整。
        neutral-color-weight:
          title: 中性色权重
          description: 设置低饱和度颜色的最低权重。彩色内容的权重高于灰色内容。
      shader:
        title: 着色器响应
        dark-base:
          title: 亮度下限
          description: 设置黑色屏幕下的模型亮度。白色屏幕显示模型原有亮度，屏幕变暗时模型会逐渐接近此下限。
        base-curve:
          title: 亮度曲线
          description: 设置模型亮度从下限升至原始亮度的变化曲线。大于 1 时，半亮屏幕下的模型更接近亮度下限。
        local-share:
          title: 局部光照占比
          description: 设置模型亮度受附近光线影响的程度，相对于整块屏幕的影响。设为 0 时，模型亮度不随窗口位置变化。
        tint:
          title: 色调
          description: 设置模型受屏幕色相影响的程度。设为 0 时，仅屏幕亮度影响模型。
        color-boost:
          title: 暗光色彩增强
          description: 设置模型对暗而高饱和度光线的额外色彩响应。亮度保持不变，各颜色通道不会低于未受光模型的值。
        wrap-intensity:
          title: 光线包裹强度
          description: 设置背景颜色渗入模型边缘的强度。
        wrap-saturation:
          title: 光线包裹饱和度
          description: 设置包裹光保留屏幕色相的程度。0 添加相同亮度的白光，1 添加完整的屏幕颜色。
        backlight:
          title: 逆光
          description: 设置角色背后的光线照亮整体细窄轮廓的强度。
        wrap-diffuse:
          title: 光线包裹宽度
          description: 设置背景颜色从模型边缘向内渗入的距离。
        translucent-wrap:
          title: 减少半透明部位的光线包裹
          description: 按模型透明度的平方缩放包裹光和轮廓光。部分透明的部位本就能透出桌面。
      preview-shader:
        title: 着色器预览
        description: 使用实时环境和上述设置，在测试卡上运行实际着色器。
        window-mapping: 滤镜将此画布视作完整舞台窗口，因此预览并非舞台的逐像素复现。
        filtered: 着色器输出
        unavailable: 预览需要 WebGL，但此窗口无法创建上下文。
        environment:
