          neutral: 尚未收到快照，预览使用中性环境。
        regions:
          title: 测试卡区域
          body: 宽主体显示从 sRGB {low} 到 {high} 的色调渐变，用于观察亮度、对比度、色度和余量。
          bars: 条带宽度分别为 {first}、{second}、{third}、{fourth} 和 {fifth} 像素，用于观察光线包裹在细窄形状中的渗入距离。
