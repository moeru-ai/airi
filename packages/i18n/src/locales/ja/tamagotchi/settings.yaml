          description: 赤い長方形はAIRIのウィンドウを示します。破線の長方形はライトマップが覆う領域を示します。
          unavailable: キャプチャフレームがありません。
        pixels:
          title: ピクセルの判定
          total: 合計
          accepted: 採用
          excluded: 描画済み
          transparent: 透明
          see-through: 透過
        maps:
          title: ライトマップ
          window: 各マップはAIRIウィンドウと、その各辺から半ウィンドウ分までを覆います。輪郭線はウィンドウを示します。
          unavailable: 環境データがありません。
          target: 計測値
          applied: 平滑化後の適用値
          surround:
            title: 周囲光マップ
            description: ウィンドウの周囲と背後の画面を広くぼかします。光の色と入射方向を表します。
          contact:
            title: 接触光マップ
            description: 同じ内容を狭い範囲でぼかします。このマップで光の回り込みと逆光の縁取りを制御します。
      sampling:
        capture-interval:
          title: キャプチャ間隔
          description: 画面サンプル間の時間を設定します。キャプチャストリームはこの頻度で動作します。
        title: 画面サンプリング
        response-time:
          title: 応答時間
          description: サンプリングした色が画面の変化に追従する速さを設定します。
        sample-width:
          title: サンプルサイズ
          description: 縮小キャプチャフレームの幅を設定します。幅を広げるとライトマップの詳細が増えます。高さはディスプレイの比率に従います。
        neutral-color-weight:
          title: 無彩色の重み
          description: 彩度の低い色の最小の重みを設定します。有彩色の内容は灰色より重く扱われます。
      main-window-note: 変更はAIRIのメインウィンドウに反映されます。
      title: Live2Dの環境光
      description: 画面のサンプリングとLive2Dのカラーライティングシェーダーを調整します
      controls:
        title: 光源と出力
      enabled:
        title: 環境光
        description: 使用中のLive2Dモデルに環境光フィルターを適用します。
      source:
        title: 光源
        options:
          screen-capture: 画面キャプチャ
          forced-color: 指定色
      mode:
        title: ライティングモード
        options:
          window-gradient: ウィンドウのグラデーション
          global: 全体の環境光
      forced-color:
        title: テスト用の色
        description: 画面キャプチャを使わずにこの色を適用します。
      strength:
        title: 光の強さ
        description: 効果全体の強さを設定します。1が想定した見た目で、3まで上げると縁への光の回り込みと逆光が強くなります。
      squint:
        title: 急な明るさの変化で目を細める
        description: キャラクターの順応より速く画面が明るくなると、目を細めます。明るさが続く場合は目を開いたままにします。0で無効になります。
      shader:
        title: シェーダーの応答
        dark-base:
          title: 輝度の下限
          description: 黒い画面上でのモデルの明るさを設定します。白い画面では原画の明るさになり、暗い画面ではこの下限に向けて暗くなります。
        base-curve:
          title: 輝度カーブ
          description: 下限から原画までモデルの明るさが増す曲線を設定します。1より大きい値では、半分の明るさの画面でモデルが下限に近い明るさになります。
        local-share:
          title: 局所光の割合
          description: モデルの明るさが画面全体よりも近くの光に従う割合を設定します。0ではウィンドウの位置に関係なく明るさが一定になります。
        tint:
          title: 色味
          description: モデルが画面の色相を取り込む強さを設定します。0では画面の明るさだけが反映されます。
        color-boost:
          title: 暗い光の彩度強調
          description: 暗く彩度の高い光から取り込む追加の色を設定します。明るさは維持され、どのチャンネルも照明なしのモデルの値より下がりません。
        wrap-intensity:
          title: 光の回り込みの強さ
          description: 背景の色がモデルの縁ににじむ強さを設定します。
        wrap-saturation:
          title: 回り込む光の彩度
          description: 回り込む光が画面の色相を保持する割合を設定します。0では同じ明るさの白い光を加え、1では画面の色をそのまま加えます。
        backlight:
          title: 逆光
          description: キャラクターの背後からの光が、全体の縁にある細い輪郭を照らす強さを設定します。
        wrap-diffuse:
          title: 光の回り込みの幅
          description: 背景の色がモデルの縁から内側へ届く距離を設定します。
        translucent-wrap:
          title: 半透明部分の光の回り込みを減らす
          description: 光の回り込みと縁取りにモデルのアルファ値の二乗を掛けます。半透明で描かれた部分は、すでにデスクトップが透けて見えます。
      preview-shader:
        title: シェーダーのプレビュー
        description: 現在の環境と上記の設定を使い、テストカードに実際のシェーダーを適用します。
        window-mapping: フィルターはこのキャンバスをステージウィンドウ全体として扱うため、プレビューはステージをピクセル単位で正確に再現するものではありません。
        filtered: シェーダー出力
        unavailable: プレビューにはWebGLが必要ですが、このウィンドウではコンテキストを作成できませんでした。
        environment:
          live: 光はAIRIのメインウィンドウが公開した最新のスナップショットに基づきます。
          neutral: スナップショットがまだ届いていないため、プレビューはニュートラルな環境を使います。
        regions:
          title: テストカードの領域
          body: 幅広の本体にはsRGB {low}から{high}までの階調を配置しています。明るさ、コントラスト、彩度、余裕幅を確認できます。
          bars: バーの幅は{first}、{second}、{third}、{fourth}、{fifth}ピクセルです。細い形状に光がどこまで回り込むかを示します。
          patches: 2つのパッチはアルファ値{strong}と{weak}で描画され、半透明部分の光の回り込み設定はこれらに作用します。
