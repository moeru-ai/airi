        title: Spotlight ショートカット
        description: ショートカットをクリックしてから新しいショートカットを押します。Esc でキャンセルします。
      actions:
        recording: キーを押してください
        reset: リセット
      errors:
        load: ショートカットを読み込めませんでした
        conflict: このショートカットは使用中です。
        failed: ショートカットの更新に失敗しました
        requiresModifier: Cmd、Ctrl、Alt、Super のいずれかを少なくとも 1 つ使用してください。
        requiresHoldModifier: Cmd、Ctrl、Alt、Superのいずれか、またはF13などのファンクションキーを使用してください。Shiftだけでは使えません。
        denied: AIRIがグローバルキーを読み取れません。アクセシビリティ設定でAIRIを許可してから再試行してください。
        unsupported: このシステムはグローバルショートカットのキーを離したことを検出できません。
      toggle-move:
        label: 移動の切り替え
      toggle-resize:
        label: サイズ変更の切り替え
      toggle-ignore-mouse-event:
        label: マウスイベント無視の切り替え
      press-keys: 何かキーを押してください…
      push-to-talk:
        title: プッシュトゥトークのショートカット
        description: どのアプリでも、このショートカットを押しながらAIRIに話しかけられます。ショートカットをクリックして新しいキーの組み合わせを押してください。Escでキャンセルできます。
        inactive: このショートカットは、聴覚の入力モードがプッシュトゥトークで、マイクがオンの場合のみ使えます。
    developer:
      sections:
        section:
          use-window-mouse:
            title: ウィンドウマウス ツールを使用
            description: Electronウィンドウのカーソル位置をテストします
    general:
      hide-app-icon:
        title: タスクバー／Dockのアイコンを非表示
        description: AIRIをトレイにのみ表示します。ウィンドウの表示や終了にはトレイメニューを使ってください。変更はすぐに適用されます。
        load-error: アプリアイコンの設定を読み込めませんでした。
        save-error: アプリアイコンの設定を更新できませんでした。
