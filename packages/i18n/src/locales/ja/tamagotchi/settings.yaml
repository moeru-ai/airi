        description: 各ポーズをスプリングに渡す前に、生成器の出力を平滑化し、小さな変化を保留します。
        actions:
          enable: フィルターを有効化
          disable: フィルターを無効化
          reset: 状態をリセット
        smoothing:
          label: EMA平滑化
          description: 採用した各目標値を前の出力と混ぜ合わせます。値を上げると揺れが減りますが、遅延が増えます。
        cutoff:
          label: 変化のしきい値
          description: チャンネルの正規化された累積変化がこの値に達するまで保持します。
        diagnostics:
          status: 状態
          input-change: 未処理の変化のMAE
          output-change: フィルター後の変化のMAE
          cutoff-tracks: 保持中のチャンネル
        status:
          waiting: 生成器を待機中
          filtering: 生成器の出力をフィルター処理中
          bypassed: 生成器の未処理出力を通過
      breath:
        title: 手動呼吸
        description: 吸気、呼気、休止の時間を調整してParamBreathを制御します。収録データには呼吸を追加しません。
        actions:
          enable: 呼吸を有効化
          disable: 呼吸を無効化
          reset: 周期をリセット
        cycle:
          label: 呼吸時間
          description: 呼気後の休止に入る前の、1回の吸気と呼気の時間を設定します。
        inhale:
          label: 吸気の割合
          description: 呼吸時間のうち吸気に使う割合を設定します。残りは呼気に使います。
        dwell:
          label: 呼気後の休止
          description: 次の吸気までParamBreathを最小値に保持します。
        stage:
          dwell: 呼気後の休止
          inhale: 吸気
          exhale: 呼気
        minimum:
          label: 最小値
          description: ParamBreathに書き込む最小値を設定します。
        maximum:
          label: 最大値
          description: ParamBreathに書き込む最大値を設定します。
        diagnostics:
          stage: 段階
          phase: 周期の進行状況
          output: ParamBreathの出力
      spring:
        follow:
          label: 追従
          description: モーションがジョイスティックに追従する速さです。
        inertia:
          label: 慣性
          description: モーションが運動量を保持する強さです。
    presence-bubble:
      thinking:
        title: 思考 (Thinking)
        description: ドットを表示します。未読件数より優先されます。
      title: プレゼンスバブル
      description: キャラクターの頭上のバブルを操作し、メインウィンドウで確認します
      override:
        title: ここからバブルを操作
        description: オフの場合、チャットのターン実行中以外はステージにバブルを表示しません。
      unread:
        title: 未読メッセージ
        description: 頭上のパネルにマークと件数を表示します。
      main-window-note: 変更はAIRIのメインウィンドウに反映されます。
    io-tracer:
      title: 入出力トレーサー
      recording:
        title: 入出力トレースを自動記録
        description: 完了した入出力スパンをアプリのデータフォルダーにJSON Lines形式で保存し、コーディングエージェントが分析できるようにします。7日を過ぎたファイルは削除されます。
screen-capture:
  permissions-prompt:
    title: 画面キャプチャ
