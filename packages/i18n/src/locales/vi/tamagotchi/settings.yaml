          unavailable: Không có khung hình đã chụp.
        pixels:
          title: Phân loại điểm ảnh
          total: Tổng
          accepted: Được chấp nhận
          excluded: Đã tô
          transparent: Trong suốt
          see-through: Nhìn xuyên qua
        maps:
          title: Bản đồ ánh sáng
          window: Mỗi bản đồ bao phủ cửa sổ AIRI và thêm nửa cửa sổ ở mỗi phía. Đường viền đánh dấu cửa sổ.
          unavailable: Không có dữ liệu môi trường.
          target: Đã đo
          applied: Áp dụng sau khi làm mượt
          surround:
            title: Bản đồ xung quanh
            description: Làm mờ rộng màn hình quanh và sau cửa sổ. Mang màu ánh sáng và hướng ánh sáng chiếu tới.
          contact:
            title: Bản đồ tiếp xúc
            description: Làm mờ hẹp cùng nội dung. Bản đồ này điều khiển ánh sáng bọc viền và viền ngược sáng.
      sampling:
        capture-interval:
          title: Khoảng thời gian chụp
          description: Đặt khoảng thời gian giữa các mẫu màn hình. Luồng chụp chạy ở tốc độ này.
        title: Lấy mẫu màn hình
        response-time:
          title: Thời gian phản hồi
          description: Đặt tốc độ màu lấy mẫu thích nghi với thay đổi trên màn hình.
        sample-width:
          title: Kích thước mẫu
          description: Đặt chiều rộng khung hình chụp thu nhỏ. Khung rộng hơn thêm chi tiết cho bản đồ ánh sáng. Chiều cao theo tỷ lệ màn hình.
        neutral-color-weight:
          title: Trọng số màu trung tính
          description: Đặt trọng số tối thiểu cho màu có độ bão hòa thấp. Nội dung có màu được tính nhiều hơn màu xám.
      main-window-note: Thay đổi xuất hiện trong cửa sổ chính của AIRI.
      title: Ánh sáng môi trường Live2D
      description: Điều chỉnh lấy mẫu màn hình và shader ánh sáng màu Live2D
      controls:
        title: Nguồn sáng và đầu ra
      enabled:
        title: Ánh sáng môi trường
        description: Áp dụng bộ lọc ánh sáng môi trường cho mô hình Live2D đang hoạt động.
      source:
        title: Nguồn sáng
        options:
          screen-capture: Chụp màn hình
          forced-color: Màu cố định
      mode:
        title: Chế độ chiếu sáng
        options:
          window-gradient: Chuyển màu theo cửa sổ
          global: Ánh sáng môi trường toàn cục
      forced-color:
        title: Màu thử nghiệm
        description: Áp dụng màu này mà không chụp màn hình.
      strength:
        title: Cường độ ánh sáng
        description: Đặt cường độ tổng thể của hiệu ứng. 1 là diện mạo được thiết kế, tăng đến 3 làm ánh sáng viền và ngược sáng mạnh hơn.
      squint:
        title: Nheo mắt khi độ sáng tăng đột ngột
        description: Nheo mắt khi màn hình sáng lên nhanh hơn khả năng thích nghi của nhân vật. Màn hình sáng ổn định sẽ để mắt mở. 0 tắt hiệu ứng này.
      shader:
        title: Phản hồi shader
        dark-base:
          title: Mức sáng tối thiểu
          description: Đặt độ sáng mô hình trên màn hình đen. Màn hình trắng hiển thị hình gốc, màn hình tối giảm độ sáng về mức tối thiểu này.
        base-curve:
          title: Đường cong độ sáng
          description: Đặt cách độ sáng mô hình tăng từ mức tối thiểu đến hình gốc. Trên 1, màn hình sáng một nửa giữ mô hình gần mức tối thiểu hơn.
        local-share:
          title: Tỷ lệ ánh sáng cục bộ
          description: Đặt mức độ sáng mô hình theo ánh sáng cạnh nó thay vì toàn màn hình. Ở 0, độ sáng giữ nguyên dù cửa sổ ở đâu.
        tint:
          title: Sắc màu
          description: Đặt mức mô hình nhận sắc màu từ màn hình. Ở 0, chỉ độ sáng màn hình ảnh hưởng đến mô hình.
        color-boost:
          title: Tăng màu trong ánh sáng yếu
          description: Đặt lượng màu bổ sung mô hình nhận từ ánh sáng yếu nhưng bão hòa. Độ sáng giữ nguyên và không kênh nào giảm dưới mức mô hình chưa chiếu sáng.
        wrap-intensity:
          title: Cường độ ánh sáng bọc viền
          description: Đặt mức màu nền lan lên rìa mô hình.
        wrap-saturation:
          title: Độ bão hòa ánh sáng bọc viền
          description: Đặt mức ánh sáng bọc viền giữ sắc màu màn hình. 0 thêm ánh sáng trắng cùng độ sáng. 1 thêm toàn bộ màu màn hình.
        backlight:
          title: Ngược sáng
          description: Đặt mức ánh sáng phía sau nhân vật chiếu lên đường viền mỏng quanh toàn bộ rìa.
        wrap-diffuse:
          title: Độ rộng ánh sáng bọc viền
          description: Đặt khoảng cách màu nền bọc viền lan vào trong rìa mô hình.
        translucent-wrap:
          title: Giảm ánh sáng bọc viền ở phần bán trong suốt
          description: Điều chỉnh ánh sáng bọc viền và viền theo bình phương alpha của mô hình. Phần có alpha một phần đã để lộ màn hình nền phía sau.
      preview-shader:
        title: Xem trước shader
        description: Chạy shader thật trên thẻ thử nghiệm với môi trường hiện tại và cài đặt phía trên.
        window-mapping: Bộ lọc coi canvas này là toàn bộ cửa sổ sân khấu, nên bản xem trước không sao chép sân khấu chính xác từng điểm ảnh.
        filtered: Đầu ra shader
        unavailable: Bản xem trước cần WebGL, nhưng cửa sổ này không thể tạo ngữ cảnh.
        environment:
          live: Ánh sáng lấy từ ảnh chụp trạng thái mới nhất do cửa sổ chính của AIRI công bố.
          neutral: Chưa nhận được ảnh chụp trạng thái nên bản xem trước dùng môi trường trung tính.
        regions:
          title: Vùng trên thẻ thử nghiệm
          body: Phần thân rộng có dải tông từ sRGB {low} đến {high}. Dải này thể hiện độ sáng, tương phản, độ đậm màu và khoảng dự phòng.
          bars: Các thanh rộng {first}, {second}, {third}, {fourth} và {fifth} điểm ảnh. Chúng cho thấy ánh sáng bọc viền lan sâu vào hình mảnh đến đâu.
          patches: Hai vùng được vẽ với alpha {strong} và {weak}, là các giá trị mà tùy chọn bọc viền phần bán trong suốt tác động lên.
