screen-capture:
  permissions-prompt:
    title: Chụp ảnh màn hình
    description: Để chụp màn hình hoặc cửa sổ, bạn cần cấp quyền ghi âm hệ thống và ghi màn hình.
    open-preferences: Mở Tùy chọn hệ thống
    dismiss: Bỏ qua
    instructions:
      step-1: Mở "Tùy chọn hệ thống", chọn "Quyền riêng tư & Bảo mật" từ thanh bên.
      step-2: Trong phần "Ghi màn hình & Âm thanh hệ thống" và "Chỉ ghi âm thanh hệ thống", hãy bật công tắc cho AIRI.
      step-2-note: Nếu không thấy AIRI trong danh sách, vui lòng thêm thủ công bằng cách nhấn nút "+" và chọn AIRI từ thư mục Ứng dụng (Applications).
microphone-permission:
  settings:
    title: Micrô
    description: Kiểm soát việc AIRI có thể dùng micrô hay không. Đặt lại lựa chọn này sẽ dừng luồng micrô hiện tại và hỏi lại vào lần sau.
    revoke: Thu hồi quyền truy cập
    reset: Đặt lại lựa chọn
  states:
    not-determined: Chưa đặt
    granted: Đã cho phép
    denied: Đã từ chối
  prompt:
    title: Cho phép truy cập micrô?
    description: AIRI dùng micrô để nhập giọng nói và phiên âm. Lựa chọn này có hiệu lực cho đến khi bạn đặt lại trong Cài đặt.
    allow: Cho phép
    deny: Từ chối
