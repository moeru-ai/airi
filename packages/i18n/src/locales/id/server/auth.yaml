verifyEmail:
  title:
    pending: Periksa kotak masuk Anda
    success: Email terverifikasi
    failed: Verifikasi gagal
  message:
    pending: Kami telah mengirimkan tautan verifikasi ke email Anda. Buka tautan tersebut untuk menyelesaikan pembuatan akun Anda — halaman ini akan berlanjut otomatis setelah Anda mengeklik tautan.
    pendingWithAddress: Kami telah mengirimkan tautan verifikasi ke {email}. Buka tautan tersebut untuk menyelesaikan pembuatan akun Anda — halaman ini akan berlanjut otomatis setelah Anda mengeklik tautan.
    success: Email Anda telah diverifikasi dan Anda telah masuk. Anda dapat menutup tab ini.
    failed: Kami tidak dapat memverifikasi email Anda ({error}). Coba minta tautan baru.
  action:
    backToSignIn: Kembali ke halaman masuk
