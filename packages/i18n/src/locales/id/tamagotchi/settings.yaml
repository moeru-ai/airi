screen-capture:
  permissions-prompt:
    title: Tangkapan Layar
    description: Untuk menangkap layar atau jendela, izin perekaman layar dan audio sistem diperlukan.
    open-preferences: Buka Pengaturan Sistem
    dismiss: Abaikan
    instructions:
      step-1: Buka "Pengaturan Sistem", pilih "Privasi & Keamanan" di bilah samping.
      step-2: Di bagian "Perekaman Layar & Audio Sistem" dan "Perekaman Audio Sistem Saja", aktifkan sakelar untuk AIRI.
      step-2-note: Jika AIRI tidak tercantum, tambahkan secara manual dengan mengeklik tombol "+" dan memilih AIRI dari folder Aplikasi.
