        sample-width:
          title: Ukuran sampel
          description: Atur lebar bingkai tangkapan yang diperkecil. Bingkai yang lebih lebar memberikan detail lebih banyak pada peta cahaya. Tinggi mengikuti layar Anda.
        neutral-color-weight:
          title: Bobot warna netral
          description: Atur bobot minimum untuk warna bersaturasi rendah. Konten berwarna berbobot lebih tinggi dibanding abu-abu.
      shader:
        title: Respons shader
        dark-base:
          title: Batas bawah kecerahan
          description: Atur kecerahan model di atas layar hitam. Layar putih menampilkan model normal, dan layar lebih gelap meredupkannya ke batas ini.
        base-curve:
          title: Kurva kecerahan
          description: Atur bagaimana kecerahan model meningkat antara batas bawah dan gambar aslinya. Di atas 1, layar setengah terang menjaga model lebih dekat ke batas bawah.
        local-share:
          title: Porsi cahaya lokal
          description: Atur seberapa banyak kecerahan model mengikuti cahaya di sebelahnya daripada keseluruhan layar. Pada nilai 0, model mempertahankan satu kecerahan di mana pun posisinya.
        tint:
          title: Nuansa warna
          description: Atur seberapa banyak rona layar diserap model. Pada nilai 0 hanya kecerahan layar yang mempengaruhi model.
        color-boost:
          title: Penguat warna cahaya redup
          description: Atur seberapa banyak warna ekstra yang diambil model dari cahaya redup namun jenuh. Kecerahan tetap sesuai cahaya, dan tidak ada saluran yang turun di bawah model tanpa cahaya.
        wrap-intensity:
          title: Intensitas pembungkus cahaya
          description: Atur seberapa kuat warna latar belakang merembes ke tepi model.
        wrap-saturation:
          title: Saturasi pembungkus cahaya
          description: Atur seberapa banyak rona layar yang dipertahankan cahaya pembungkus. 0 menambahkan cahaya putih dengan kecerahan sama. 1 menambahkan warna layar penuh.
        backlight:
          title: Lampu latar
          description: Atur seberapa kuat cahaya dari belakang karakter menerangi tepi tipis di sepanjang tubuhnya.
        wrap-diffuse:
          title: Lebar pembungkus cahaya
          description: Atur seberapa jauh warna latar belakang merembes ke dalam tepi model.
        translucent-wrap:
          title: Kurangi pembungkusan pada bagian transparan
          description: Skalakan pembungkus cahaya dan tepi berdasarkan kuadrat alfa model. Bagian yang digambar dengan alfa parsial sudah memperlihatkan desktop di belakangnya.
      preview-shader:
        title: Pratinjau shader
        description: Jalankan shader sebenarnya pada kartu uji, dengan lingkungan langsung dan pengaturan di atas.
