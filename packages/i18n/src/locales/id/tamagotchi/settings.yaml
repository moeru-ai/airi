          see-through: Tembus pandang
        maps:
          title: Peta cahaya
          window: Setiap peta mencakup jendela AIRI dan setengah jendela di setiap sisinya. Garis luar menandai jendela.
          unavailable: Tidak ada lingkungan yang tersedia.
          target: Terukur
          applied: Diterapkan setelah penghalusan
          surround:
            title: Peta sekeliling
            description: Pemburaman lebar layar di sekitar dan di belakang jendela. Membawa warna cahaya dan arah asalnya.
          contact:
            title: Peta kontak
            description: Pemburaman sempit dari konten yang sama. Peta ini mengontrol pembungkusan cahaya dan tepi lampu latar.
