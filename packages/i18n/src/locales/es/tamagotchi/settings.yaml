          window-gradient: Degradado de ventana
          global: Ambiente global
      forced-color:
        description: Aplicar este color sin captura de pantalla.
        title: Color de prueba
      strength:
        title: Intensidad de la luz
        description: Ajusta la intensidad general del efecto. 1 ofrece el aspecto previsto. Hasta 3 intensifica la luz en los bordes y la contraluz.
      squint:
        title: Entrecerrar los ojos ante cambios luminosos
        description: Entrecierra los ojos cuando la pantalla se ilumina más rápido de lo que el personaje puede adaptarse a ella. Una pantalla que permanece brillante mantiene los ojos abiertos. El valor 0 desactiva esta función.
      main-window-note: Los cambios aparecen en la ventana principal de AIRI.
      diagnostics:
        status:
          disabled: Desactivado
          starting: Iniciando
          capturing: Capturando
          forced-color: Color forzado
        capture:
          display: Pantalla y límites
          video-size: Fuente de vídeo
          window-bounds: Límites de ventana de AIRI
          excluded-region: Región excluida
          behind-luminance: Luz detrás del personaje
          updated: Última actualización
          title: Estado de captura
          description: Examina la pantalla seleccionada, las dimensiones de captura y las coordenadas de exclusión.
          sample-size: Fotograma de muestra
          exposure: Exposición de pantalla
        preview:
          title: Captura a baja escala
          description: El rectángulo rojo marca la ventana de AIRI. El rectángulo con guiones marca el área que cubre el mapa de luz.
          unavailable: No hay ningún fotograma capturado disponible.
        pixels:
          accepted: Aceptado
          excluded: Pintado
          transparent: Transparente
          title: Clasificación de píxeles
          see-through: Translúcido
        maps:
          title: Mapas de luz
          unavailable: No hay entorno disponible.
          target: Medido
          applied: Aplicado después de suavizado
          surround:
            title: Mapa envolvente
            description: Desenfoque amplio de la pantalla alrededor y detrás de la ventana. Contiene el color de la luz y la dirección de donde viene.
          window: Cada mapa cubre la ventana de AIRI y media ventana adicional por cada lado. El contorno marca la ventana.
          contact:
            title: Mapa de contacto
            description: Desenfoque estrecho del mismo contenido. Este mapa controla la luz que envuelve los bordes y el contorno de contraluz.
        title: Diagnóstico de captura
        waiting: Esperando el diagnóstico de la ventana principal de AIRI.
      sampling:
        capture-interval:
          title: Intervalo de captura
          description: Ajusta el intervalo entre muestras de pantalla. El flujo de captura usa esta frecuencia.
        title: Muestreo de pantalla
        response-time:
          title: Tiempo de respuesta
          description: Ajusta la rapidez con la que los colores muestreados se adaptan a un cambio de pantalla.
        sample-width:
          title: Tamaño de muestra
          description: Ajusta el ancho del fotograma de captura reducido. Un fotograma más ancho añade detalle a los mapas de luz. La altura sigue la proporción de la pantalla.
        neutral-color-weight:
          title: Peso de colores neutros
          description: Ajusta el peso mínimo de los colores poco saturados. El contenido con color pesa más que el gris.
      shader:
        title: Respuesta del shader
        dark-base:
          title: Brillo mínimo
          description: Ajusta el brillo del modelo sobre una pantalla negra. Una pantalla blanca lo muestra como fue dibujado. Una pantalla oscura lo atenúa hacia este mínimo.
        base-curve:
          title: Curva de brillo
          description: Ajusta cómo aumenta el brillo del modelo desde el mínimo hasta el dibujo original. Por encima de 1, una pantalla a media luz mantiene el modelo más cerca del mínimo.
        local-share:
          title: Proporción de luz local
          description: Ajusta cuánto sigue el brillo del modelo la luz cercana en lugar de toda la pantalla. En 0, el modelo conserva el mismo brillo en cualquier posición.
        tint:
          title: Tinte
          description: Ajusta cuánto color de la pantalla adopta el modelo. En 0, solo recibe el brillo de la pantalla.
        color-boost:
          title: Refuerzo de color con poca luz
          description: Ajusta el color adicional que recibe el modelo de una luz tenue pero saturada. El brillo no cambia y ningún canal baja del valor del modelo sin iluminar.
        wrap-intensity:
          title: Intensidad de luz en los bordes
          description: Ajusta cuánto se extiende el color del fondo sobre el borde del modelo.
        wrap-saturation:
          title: Saturación de luz en los bordes
          description: Ajusta cuánto color de la pantalla conserva la luz de los bordes. 0 añade luz blanca del mismo brillo. 1 añade el color completo de la pantalla.
        backlight:
          title: Contraluz
          description: Ajusta cuánto ilumina la luz de detrás del personaje el contorno fino de todo su borde.
        wrap-diffuse:
          title: Ancho de luz en los bordes
          description: Ajusta hasta dónde llega el color del fondo dentro del borde del modelo.
        translucent-wrap:
          title: Reducir la luz de los bordes en partes translúcidas
          description: Escala la luz y el contorno por el cuadrado del alfa del modelo. Las partes con alfa parcial ya dejan ver el escritorio.
      preview-shader:
        title: Vista previa del shader
        description: Ejecuta el shader real sobre una carta de prueba con el entorno actual y los ajustes anteriores.
        window-mapping: El filtro trata este lienzo como toda la ventana del escenario, así que la vista previa no reproduce el escenario píxel por píxel.
        filtered: Salida del shader
        unavailable: La vista previa necesita WebGL, pero esta ventana no pudo crear un contexto.
        environment:
          live: La luz procede de la última instantánea publicada por la ventana principal de AIRI.
          neutral: Aún no ha llegado ninguna instantánea, así que la vista previa usa el entorno neutro.
        regions:
          title: Regiones de la carta de prueba
          body: El cuerpo ancho contiene una rampa tonal de sRGB {low} a {high}. A lo largo se muestran brillo, contraste, croma y margen disponible.
          bars: Las barras tienen {first}, {second}, {third}, {fourth} y {fifth} píxeles de ancho. Muestran hasta dónde llega la luz dentro de una forma fina.
          patches: Las dos muestras usan alfa {strong} y {weak}. La opción de luz en partes translúcidas actúa sobre estos valores.
