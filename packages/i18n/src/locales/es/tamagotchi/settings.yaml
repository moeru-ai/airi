devtools:
  title: Desarrollador
  pages:
    context-flow:
      title: Flujo de contexto
    live2d-ambient-light:
      title: Luz ambiente Live2D
      description: Ajustar muestreo de pantalla y el sombreado de color Live2D
      controls:
        title: Fuente de luz y salida
      enabled:
