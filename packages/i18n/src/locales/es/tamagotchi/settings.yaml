screen-capture:
  permissions-prompt:
    title: Captura de pantalla
    description: Para capturar las pantallas o ventanas, se requieren permisos de grabación de pantalla y audio del sistema.
    open-preferences: Abrir Preferencias del Sistema
    dismiss: Descartar
    instructions:
      step-1: Abre "Preferencias del sistema", selecciona "Privacidad y Seguridad" en la barra lateral.
      step-2: En las secciones "Grabación de pantalla y del audio del sistema" y "Solo grabación del audio del sistema", encienda los interruptores para AIRI.
      step-2-note: Si AIRI no aparece en la lista, añádelo manualmente haciendo clic en el botón "+" y seleccionando AIRI de la carpeta Aplicaciones.
microphone-permission:
  states:
    not-determined: Sin configurar
    granted: Permitido
    denied: Denegado
  settings:
    title: Micrófono
    description: Controla si AIRI puede usar el micrófono. Restablecer esta decisión detiene el flujo actual del micrófono y vuelve a pedir permiso la próxima vez.
    revoke: Revocar acceso
    reset: Restablecer decisión
  prompt:
    title: ¿Permitir el acceso al micrófono?
    description: AIRI usa el micrófono para la entrada de voz y la transcripción. Esta decisión se mantiene hasta que la restablezcas en los ajustes.
    allow: Permitir
    deny: Denegar
