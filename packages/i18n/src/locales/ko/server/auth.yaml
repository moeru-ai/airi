electronCallback:
  title:
    loading: 로그인 완료 중
    openingAiri: AIRI 여는 중
    signedIn: 로그인 되었습니다
    signInFailed: 로그인 실패
    finishSignInInAiri: AIRI 로그인 끝내기
    openAiriToContinue: AIRI를 열어서 계속해 주세요
  message:
    checkingResponse: 로그인 응답을 확인하고 AIRI에 핸드오프를 준비합니다.
    passingToAiri: 로그인 정보를 AIRI로 전달합니다. 이 창은 잠시 후 닫힐 것입니다.
    syncedAndSafeToClose: 로그인을 시도했던 AIRI 클라이언트에 알림을 보냈습니다.
    invalidResponse: 잘못된 응답 형식입니다. 이 정보를 사용할 수 없습니다.
    loopbackUnreachable: 브라우저가 로컬 반환 포트를 통해 AIRI에 도달하지 못했습니다.
    tryOpenDirectly: 로컬 핸드오프를 직접 실행합니다. 실패할 경우, 하단의 버튼을 사용해 주세요.
    automaticHandoffFailed: 자동 핸드오프가 이 브라우저 세션에서 끝나지 못했습니다.
  label:
    signIn: 로그인하기
    safeToClose: 이 탭을 닫으셔도 됩니다.
    whyStillHere: 이 탭이 왜 아직 여기 있을까요?
  action:
    openAiriManually: 수동으로 AIRI 열기
  hint:
    closeTabManually: 일부 브라우저들은 이 창을 자동으로 닫는 것을 허용하지 않습니다. 수동으로 닫을 수 있습니다.
signIn:
  title: 로그인
  step:
    identify:
      heading: 로그인
      description: 이메일을 입력하여 로그인하거나 계정을 만드세요.
    password:
      heading: 다시 오신 것을 환영합니다
      description: '{email}(으)로 계속합니다.'
    create:
      heading: 계정 만들기
      description: '{email}의 새 계정을 만듭니다.'
  email:
    label: 이메일
  password:
    label: 비밀번호
    placeholder: 비밀번호 입력
  newPassword:
    label: 비밀번호 만들기
    placeholder: 8자 이상
  confirmPassword:
    label: 비밀번호 확인
    placeholder: 비밀번호 다시 입력
  name:
    label: 표시 이름
    placeholder: 선택 사항이며 기본값은 이메일의 사용자 이름입니다
  action:
    continue: 계속
    signIn: 로그인
    createAccount: 계정 만들기
    forgotPassword: 비밀번호를 잊으셨나요?
    useDifferentEmail: 다른 이메일 사용
  divider:
    or: 또는
  message:
    redirecting: '{provider}(으)로 이동 중…'
  error:
    fallback: 로그인 실패
    providerTimeout: 제공업체 로그인 시간이 초과되었습니다. 다시 시도하세요.
    unknown: 알 수 없는 오류가 발생했습니다
    socialOnlyNoPassword: 이 이메일은 Google 또는 GitHub로 등록되었습니다. 아래 버튼으로 로그인하세요. 로그인 후 계정 설정에서 비밀번호를 추가할 수 있습니다.
    passwordMismatch: 비밀번호와 확인 값이 일치하지 않습니다.
    invalidEmail: 유효한 이메일 주소를 입력하세요.
  footer:
    prefix: 계속하시려면, 저희의
    terms: 이용 약관
    and: 및
    privacy: 정책
verifyEmail:
