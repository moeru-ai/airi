    pending: 받은편지함 확인
    success: 이메일 인증 완료
    failed: 인증 실패
  message:
    pending: 이메일로 인증 링크를 보냈습니다. 링크를 열어 계정 생성을 완료하세요. 링크를 클릭하면 이 페이지가 자동으로 계속 진행됩니다.
    pendingWithAddress: '{email}(으)로 인증 링크를 보냈습니다. 링크를 열어 계정 생성을 완료하세요. 링크를 클릭하면 이 페이지가 자동으로 계속 진행됩니다.'
    success: 이메일이 인증되었고 로그인되었습니다. 이 탭을 닫아도 됩니다.
    failed: 이메일을 인증하지 못했습니다({error}). 새 링크를 요청하세요.
