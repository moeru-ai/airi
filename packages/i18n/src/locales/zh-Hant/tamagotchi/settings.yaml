devtools:
  title: 開發者
  pages:
    context-flow:
      title: 上下文流程
    lag-visualizer:
      title: 卡頓可視化
    live2d-motion:
      title: Live2D 動作控制
      description: 控制 Live2D 的眼睛、頭部與身體動作。
      actions:
        back: 返回
      panels:
        direct-control: 直接控制
        preview: 模型預覽
        timeline: 時間軸
        inference: 模型推理
      preview:
        groups:
          expression: 表情
          offset: 位置偏移
        values:
          squint: 瞇眼
          mouth-form: 嘴型
          mouth-open: 張開
      joystick-label: Live2D 動作搖桿
      instructions: 拖曳搖桿，或使用方向鍵控制 X/Y 軸。R 讓眼睛微瞇。F 讓眼睛更瞇。C 閉上眼睛。W/S 改變嘴型。空白鍵張開嘴巴。A/D 控制身體 X 軸。Q/E 讓頭部左右傾斜。放開按鍵後會平滑回到中央。
      parameter-note: 搖桿控制 X/Y 軸。R 映射至 1/3 瞇眼。F 映射至 2/3 瞇眼。C 映射至完全閉眼。W/S 映射至嘴型 ±1。空白鍵映射至嘴巴張開 1。A/D 映射至身體 X 軸 ±10°。Q/E 映射至頭部 Z 軸 ±30°。
      input:
        keyboard: 鍵盤
        controller: 控制器
      input-actions:
        move-body-head: 移動身體與頭部
        tilt-head: 傾斜頭部
        blink: 眨眼
        open-mouth: 張開嘴巴
        mouth-shape: 改變嘴型
      eye-view:
        title: 固定視線
        description: 選擇目標後，眼睛會抵銷頭部動作並持續注視目標。
        pad-label: 固定視線目標
        actions:
          enable: 啟用注視
          disable: 停用注視
          center: 目標置中
        counter:
          label: 頭部抵銷強度
          description: 眼睛抵銷頭部 X/Y 軸動作的強度。
        values:
          target: 目標
          output: 眼睛輸出
      editor:
        title: 動作編輯器
        instructions: 灰色曲線是原始動作。新增動作疊加層或視線目標關鍵影格。選取軌道後，拖曳其控制點。
        play: 播放時間軸
        pause: 暫停時間軸
        undo: 復原
        redo: 重做
        crop-to-view: 裁切至檢視範圍
        reset-view: 重設檢視
        export-project: 匯出專案
        import-project: 匯入專案
        import-error: 此檔案不是有效的 AIRI Live2D 動作專案。
        playback:
          label: 時間軸播放控制
          start: 跳至開頭
          step-backward: 後退一格
          step-forward: 前進一格
          end: 跳至結尾
          timecode: 目前與總時間碼
        input-actions:
          play: 播放
          stop: 停止
          start: 跳至開頭
          end: 跳至結尾
          step-backward: 後退一格
          step-forward: 前進一格
          restart-recording: 重新錄製
          clear-timeline: 清空時間軸
          previous-track: 選取上一條軌道
          next-track: 選取下一條軌道
        timeline-label: 動作時間軸
        timeline-help: 拖曳尺規可搜尋時間。使用滾輪縮放。按住 Shift 並拖曳可平移。在所選曲線按兩下可新增控制點。每個視線目標關鍵影格會持續至下一個關鍵影格。
        overlay-count: '{count} 個疊加層'
        controls:
          add: 相加
          replace: 取代
          create-keyframes: 建立關鍵影格
          weight: 權重
          remove: 移除
        tracks:
          viewTargetX: 視線目標 X
          viewTargetY: 視線目標 Y
          eyeX: 眼睛 X
          eyeY: 眼睛 Y
          eyeOpen: 眼睛張開
          headX: 頭部 X
          headY: 頭部 Y
          headZ: 頭部 Z
          bodyX: 身體 X
          bodyY: 身體 Y
          bodyZ: 身體 Z
          mouthForm: 嘴型
          mouthOpen: 嘴巴張開
      var:
        title: VAR 待機動作產生器
        description: 擬合已錄製動作，再產生新的待機動作序列。
        actions:
          fit: 擬合目前動作
          refit: 重新擬合目前動作
          generate: 產生動作
          stop: 停止產生
          new-seed: 新種子
        order:
          label: VAR 階數
          description: 每次預測使用的先前影格數。
        residual:
          label: 殘差強度
          description: 產生的變化量；零代表確定性預測。
        diagnostics:
          source: 來源
          model: 模型
          fit: 擬合
          run: 已產生動作
        status:
          no-source: 請先匯入或錄製動作
          source-ready: '{count} 個取樣 · {duration}s'
          fit-failed: VAR 擬合失敗。
        values:
          frames: '{count} 個影格'
          model: '{channels} 個通道 · {features} 個項目'
          fit: '{frames} 個影格 · RMSE {error} · {duration}ms'
          run: '種子 {seed} · {duration}'
      ar-hmm:
        title: AR-HMM 待機動作產生器
        description: 學習動作狀態與轉換，以產生更多變化的待機動作。
        actions:
          fit: 擬合動作
          refit: 重新擬合
          generate: 產生
          stop: 停止
          new-seed: 新種子
        states:
          label: 隱藏狀態
          description: 模型可學習的動作模式數量。
        order:
          label: AR 階數
          description: 每個狀態使用的先前影格數。
        residual:
          label: 創新強度
          description: 每個狀態內的變化量。
        diagnostics:
          source: 來源
          model: 模型
          fit: 擬合
          states: 狀態占比
          run: 已產生動作
        status:
          no-source: 請先匯入或錄製動作
          source-ready: '{count} 個取樣 · {duration}s'
          fit-failed: AR-HMM 擬合失敗。
        values:
          count: '{count} 個狀態'
          frames: '{count} 個影格'
          model: '{states} 個狀態 · {channels} 個通道 · {features} 個項目'
          fit: 'log p/影格 {likelihood} · {duration}ms'
          states: '{occupancy} · 停留 {dwell}s'
          run: '狀態 {state} · 種子 {seed} · {duration}'
      output-filter:
        title: 產生器輸出濾波器
        description: 在彈簧接收每個姿勢前，平滑產生器輸出並抑制微小變化。
        actions:
          enable: 啟用濾波器
          disable: 停用濾波器
          reset: 重設狀態
        smoothing:
          label: EMA 平滑
          description: 將每個接受的目標與上一個輸出混合。數值越高，移除的抖動越多，但延遲也越長。
        cutoff:
          label: 變化截止值
          description: 在累積的正規化變化達到此值前，保持通道的上一個目標。
        diagnostics:
          status: 狀態
          input-change: 原始變化 MAE
          output-change: 濾波後變化 MAE
          cutoff-tracks: 保持的通道
        status:
          waiting: 等待產生器
          filtering: 正在濾波產生器輸出
          bypassed: 正在傳遞原始產生器輸出
      breath:
        title: 手動呼吸
        description: 使用可調整的吸氣、呼氣與停留時間控制 ParamBreath，且不將呼吸資料加入錄製內容。
        actions:
          enable: 啟用呼吸
          disable: 停用呼吸
          reset: 重設週期
        cycle:
          label: 呼吸時間
          description: 設定一次吸氣與呼氣的時間，不包含呼氣後停留。
        inhale:
          label: 吸氣占比
          description: 設定呼吸時間中用於吸氣的比例。剩餘時間用於呼氣。
        dwell:
          label: 呼氣後停留
          description: 在下一次吸氣前，將 ParamBreath 保持在最小值。
        minimum:
          label: 最小值
          description: 設定寫入 ParamBreath 的最低值。
        maximum:
          label: 最大值
          description: 設定寫入 ParamBreath 的最高值。
        diagnostics:
          stage: 階段
          phase: 週期進度
          output: ParamBreath 輸出
        stage:
          inhale: 吸氣
          exhale: 呼氣
          dwell: 呼氣後停留
      spring:
        follow:
          label: 跟隨
          description: 動作跟隨搖桿的速度。
        inertia:
          label: 慣性
          description: 動作保留的動量。
      groups:
        eyes: 眼睛
        head: 頭部
        body: 身體
      recording:
        actions:
          record: 錄製
          stop-recording: 停止錄製
          play: 播放
          stop-playback: 停止播放
          export: 匯出
          import: 匯入
        status:
          empty: 尚無動作錄製
          recording: 正在錄製動作
          playing: 正在播放動作
          ready: '{count} 個取樣 · {duration}'
        import-error: 此檔案不是有效的 AIRI Live2D 動作錄製檔。
    performance-visualizer:
      title: 效能顯示器
      description: 切換 FPS/長任務/記憶體覆蓋
    markdown-stress:
      title: Markdown Stress
      description: 使用大量聊天負載來進行 Markdown 解析與渲染的壓力測試
    io-tracer:
      title: IO Tracer
    widgets-calling:
      title: 小工具調用
screen-capture:
  permissions-prompt:
    title: 螢幕截圖
    description: 螢幕與語音錄製權限對於截取螢幕或視窗來說是必要的。
    open-preferences: 打開系統偏好設定
    dismiss: 取消
    instructions:
      step-1: 打開「系統偏好設定」，從側邊欄中選擇「隱私與安全」。
      step-2: 在「螢幕與系統聲音錄製」以及「系統聲音錄製」區域，開啟 AIRI 的開關。
      step-2-note: 如果 AIRI 沒有被列出，則請手動按下「+」按鈕並從應用資料夾選擇 AIRI。
