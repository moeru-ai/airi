devtools:
  title: 開發者
  pages:
    context-flow:
      title: 上下文流程
    lag-visualizer:
      title: 卡頓可視化
    live2d-motion:
      title: Live2D 動作控制
      description: 使用搖桿和鍵盤控制模型眼睛、頭部與身體的 X、Y、Z 軸動作。
      joystick-label: Live2D 動作搖桿
      instructions: 拖曳搖桿，或使用方向鍵控制 X/Y 軸。R 讓眼睛微瞇。F 讓眼睛更瞇。W/S 改變嘴型。空白鍵張開嘴巴。A/D 控制身體 X 軸。Q/E 讓頭部左右傾斜。放開按鍵後會平滑回到中央。
      parameter-note: 搖桿控制 X/Y 軸。R 映射至 1/3 瞇眼。F 映射至 2/3 瞇眼。W/S 映射至嘴型 ±1。空白鍵映射至嘴巴張開 1。A/D 映射至身體 X 軸 ±10°。Q/E 映射至頭部 Z 軸 ±30°。
      editor:
        title: 關鍵影格編輯器
        instructions: 拖曳控制點來調整所選曲線。在空白處按兩下可新增控制點；在控制點上按兩下可刪除。
        play: 播放時間軸
        pause: 暫停時間軸
        tracks:
          eyeX: 眼睛 X
          eyeY: 眼睛 Y
          headX: 頭部 X
          headY: 頭部 Y
          headZ: 頭部 Z
          bodyX: 身體 X
          bodyY: 身體 Y
          bodyZ: 身體 Z
      spring:
        follow:
          label: 跟隨
          description: 控制模型接近搖桿目標的速度。
        inertia:
          label: 慣性
          description: 控制模型保留的動量與過衝幅度。
      groups:
        eyes: 眼睛
        head: 頭部
        body: 身體
      status:
        active: 手動控制已啟用
        released: 模型一般動作已啟用
      recording:
        actions:
          record: 錄製
          stop-recording: 停止錄製
          play: 播放
          stop-playback: 停止播放
          export: 匯出
          import: 匯入
        status:
          empty: 尚無動作錄製
          recording: 正在錄製動作
          playing: 正在播放動作
          ready: '{count} 個取樣 · {duration}'
        import-error: 此檔案不是有效的 AIRI Live2D 動作錄製檔。
    performance-visualizer:
      title: 效能顯示器
      description: 切換 FPS/長任務/記憶體覆蓋
    markdown-stress:
      title: Markdown Stress
      description: 使用大量聊天負載來進行 Markdown 解析與渲染的壓力測試
    io-tracer:
      title: IO Tracer
    widgets-calling:
      title: 小工具調用
screen-capture:
  permissions-prompt:
    title: 螢幕截圖
    description: 螢幕與語音錄製權限對於截取螢幕或視窗來說是必要的。
    open-preferences: 打開系統偏好設定
    dismiss: 取消
    instructions:
      step-1: 打開「系統偏好設定」，從側邊欄中選擇「隱私與安全」。
      step-2: 在「螢幕與系統聲音錄製」以及「系統聲音錄製」區域，開啟 AIRI 的開關。
      step-2-note: 如果 AIRI 沒有被列出，則請手動按下「+」按鈕並從應用資料夾選擇 AIRI。
