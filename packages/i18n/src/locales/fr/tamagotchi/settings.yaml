          window-bounds: Limites de la fenêtre AIRI
          excluded-region: Région exclue
          exposure: Exposition de l’écran
          behind-luminance: Lumière derrière le personnage
          updated: Dernière mise à jour
        preview:
          title: Capture réduite
          description: Le rectangle rouge indique la fenêtre AIRI. Le rectangle en pointillés indique la zone couverte par les cartes d’éclairage.
          unavailable: Aucune image capturée n’est disponible.
        pixels:
          title: Classement des pixels
          accepted: Acceptés
          excluded: Peints
          see-through: Translucides
        maps:
          title: Cartes d’éclairage
          window: Chaque carte couvre la fenêtre AIRI et une demi-fenêtre de plus de chaque côté. Le contour indique la fenêtre.
          unavailable: Aucun environnement disponible.
          target: Mesuré
          applied: Appliqué après lissage
          surround:
            title: Carte d’environnement
            description: Flou large de l’écran autour et derrière la fenêtre. Il transmet la couleur de la lumière et sa direction.
          contact:
            title: Carte de contact
            description: Flou étroit du même contenu. Cette carte pilote la lumière sur les bords et le liseré de contre-jour.
      sampling:
        capture-interval:
          title: Intervalle de capture
          description: Réglez l’intervalle entre les échantillons d’écran. Le flux de capture suit cette fréquence.
        title: Échantillonnage de l’écran
        response-time:
          title: Temps de réponse
          description: Réglez la vitesse d’adaptation des couleurs échantillonnées aux changements de l’écran.
        sample-width:
          title: Taille de l’échantillon
          description: Réglez la largeur de l’image capturée réduite. Une image plus large ajoute du détail aux cartes d’éclairage. La hauteur suit votre écran.
        neutral-color-weight:
          title: Poids des couleurs neutres
          description: Réglez le poids minimal des couleurs peu saturées. Le contenu coloré compte davantage que le gris.
      main-window-note: Les changements apparaissent dans la fenêtre principale d’AIRI.
      title: Lumière ambiante Live2D
      description: Réglez l’échantillonnage de l’écran et le shader d’éclairage coloré Live2D
      controls:
        title: Source lumineuse et sortie
      enabled:
        title: Lumière ambiante
        description: Appliquer le filtre de lumière ambiante au modèle Live2D actif.
      source:
        title: Source lumineuse
        options:
          screen-capture: Capture d’écran
          forced-color: Couleur imposée
      mode:
        title: Mode d’éclairage
        options:
          window-gradient: Dégradé de la fenêtre
          global: Lumière ambiante globale
      forced-color:
        title: Couleur de test
        description: Appliquer cette couleur sans capture d’écran.
      strength:
        title: Intensité lumineuse
        description: Réglez l’intensité globale de l’effet. 1 correspond au rendu prévu. Jusqu’à 3 renforce la lumière sur les bords et le contre-jour.
      squint:
        title: Plisser les yeux lors d’un éclaircissement soudain
        description: Plisser les yeux si l’écran s’éclaircit plus vite que le personnage ne s’adapte. Une luminosité constante laisse les yeux ouverts. 0 désactive cet effet.
      shader:
        title: Réponse du shader
        dark-base:
          title: Luminosité minimale
          description: Réglez la luminosité du modèle sur écran noir. Un écran blanc montre le dessin original. Un écran sombre l’atténue vers ce minimum.
        base-curve:
          title: Courbe de luminosité
          description: Réglez la montée de luminosité entre le minimum et le dessin original. Au-dessus de 1, un écran à moitié éclairé garde le modèle plus sombre.
        local-share:
          title: Part de lumière locale
          description: Réglez la part de luminosité liée à la lumière voisine plutôt qu’à tout l’écran. À 0, la luminosité reste identique partout.
        tint:
          title: Teinte
          description: Réglez la part de teinte de l’écran prise par le modèle. À 0, seule la luminosité de l’écran l’affecte.
        color-boost:
          title: Renforcement des couleurs en faible lumière
          description: Réglez la couleur supplémentaire prise dans une lumière faible mais saturée. La luminosité ne change pas. Aucun canal ne descend sous le modèle non éclairé.
        wrap-intensity:
          title: Intensité de lumière sur les bords
          description: Réglez la diffusion de la couleur du fond sur le bord du modèle.
        wrap-saturation:
          title: Saturation de lumière sur les bords
          description: Réglez la teinte conservée par la lumière des bords. 0 ajoute une lumière blanche de même luminosité. 1 ajoute toute la couleur de l’écran.
        backlight:
          title: Contre-jour
          description: Réglez la force de la lumière venant de derrière sur le fin liseré autour du personnage.
        wrap-diffuse:
          title: Largeur de lumière sur les bords
          description: Réglez la portée de la couleur du fond vers l’intérieur du bord du modèle.
        translucent-wrap:
          title: Réduire la lumière des bords sur les parties translucides
          description: Multipliez la lumière des bords et le liseré par le carré de l’alpha du modèle. Les parties semi-transparentes laissent déjà voir le bureau.
      preview-shader:
        title: Aperçu du shader
        description: Exécutez le shader réel sur une mire avec l’environnement actuel et les paramètres ci-dessus.
        window-mapping: Le filtre considère ce canevas comme toute la fenêtre de scène. L’aperçu ne reproduit donc pas la scène au pixel près.
        filtered: Sortie du shader
        unavailable: L’aperçu nécessite WebGL, mais cette fenêtre n’a pas pu créer de contexte.
        environment:
          live: La lumière vient du dernier instantané publié par la fenêtre principale d’AIRI.
          neutral: Aucun instantané n’est encore arrivé. L’aperçu utilise donc l’environnement neutre.
        regions:
          title: Régions de la mire
          body: Le corps large présente une rampe de tons sRGB de {low} à {high}. Luminosité, contraste, chroma et marge disponible y sont visibles.
          bars: Les barres font {first}, {second}, {third}, {fourth} et {fifth} pixels de large. Elles montrent la pénétration de la lumière dans une forme fine.
          patches: Les deux zones utilisent les valeurs alpha {strong} et {weak}, sur lesquelles agit l’option de lumière sur les parties translucides.
