screen-capture:
  permissions-prompt:
    title: Capture d'écran
    description: Pour capturer des écrans ou des fenêtres, les autorisations d’enregistrement de l'écran et de l'audio du système sont requises.
    open-preferences: Ouvrir les Préférences Système
    dismiss: Ignorer
    instructions:
      step-1: Ouvrir les "Préférences Système", sélectionnez "Confidentialité et Sécurité" dans la barre latérale.
      step-2: Dans les sections "Enregistrement de l’écran et des sons du système" et "Enregistrement des sons du système uniquement", activez les interrupteurs pour AIRI.
      step-2-note: Si AIRI n'est pas listé, veuillez l'ajouter manuellement en cliquant sur le bouton "+" et en sélectionnant AIRI dans le dossier Applications.
microphone-permission:
  states:
    not-determined: Non défini
    granted: Autorisé
    denied: Refusé
  prompt:
    title: Autoriser l’accès au microphone ?
    description: AIRI utilise votre microphone pour la saisie vocale et la transcription. Ce choix reste actif jusqu’à sa réinitialisation dans les paramètres.
    allow: Autoriser
    deny: Refuser
  settings:
    description: Définissez si AIRI peut utiliser le microphone. Réinitialiser ce choix arrête le flux actuel du microphone et redemande l’autorisation la prochaine fois.
    revoke: Révoquer l’accès
    reset: Réinitialiser le choix
