allow-visible-on-all-workspaces:
  title: Межпространственная видимость
  description: Позволяет окну быть видимым на всех рабочих столах, только для macOS.
microphone-permission:
  prompt:
    title: Разрешить доступ к микрофону?
    description: AIRI использует микрофон для голосового ввода и распознавания речи. Этот выбор действует до сброса в настройках.
    allow: Разрешить
    deny: Запретить
  states:
    not-determined: Не задано
    granted: Разрешено
    denied: Запрещено
  settings:
    title: Микрофон
    description: Управляйте доступом AIRI к микрофону. Сброс выбора останавливает текущий поток микрофона и запрашивает разрешение при следующем использовании.
    revoke: Отозвать доступ
    reset: Сбросить выбор
spotlight:
  errors:
    unknown: Неизвестная ошибка
    prefix: 'Что-то пошло не так: {message}'
    shortcutRegistrationFailed: 'Что-то пошло не так: не удалось зарегистрировать сочетание Spotlight.'
pages:
  modules:
    mcp-server:
      description: Возможность подключения и управления MCP сервером с инструментами
      title: MCP Сервер
  system:
    general:
      hide-app-icon:
        title: Скрыть значок на панели задач / в Dock
        description: Оставить AIRI только в системном трее. Открывайте окна и выходите через меню трея. Изменения применяются сразу.
        load-error: Не удалось загрузить настройку значка приложения.
        save-error: Не удалось обновить настройку значка приложения.
    sections:
      section:
        window-shortcuts:
          title: Клавиши навигации окна
    window-shortcuts:
      description: Редактирование горячих клавиш для управления окном
      title: Горячие клавиши управления окном
      empty: Не задано
      spotlight:
        title: Сочетание Spotlight
        description: Нажмите сочетание, затем введите новое сочетание. Нажмите Esc для отмены.
      push-to-talk:
        title: Сочетание для разговора по нажатию
        description: Удерживайте это сочетание в любом приложении, пока говорите с AIRI. Нажмите на сочетание и задайте новое. Нажмите Esc для отмены.
        inactive: Это сочетание работает только при режиме разговора по нажатию в настройках слуха и включённом микрофоне.
      actions:
        recording: Нажмите клавиши
        reset: Сбросить
      errors:
        load: Не удалось загрузить сочетание
        conflict: Это сочетание уже используется.
        failed: Не удалось обновить сочетание
        requiresModifier: Используйте хотя бы одну клавишу из Cmd, Ctrl, Alt или Super.
        requiresHoldModifier: Используйте Cmd, Ctrl, Alt, Super или функциональную клавишу, например F13. Одной Shift недостаточно.
        denied: AIRI не может считывать глобальные нажатия клавиш. Разрешите AIRI в настройках универсального доступа и повторите попытку.
        unsupported: Эта система не может определить отпускание глобального сочетания клавиш.
      toggle-move:
        label: Перемещение окна
      toggle-resize:
        label: Масштабирование окна
      toggle-ignore-mouse-event:
        label: Игнорировать курсор мыши
      press-keys: Нажмите любую клавишу...
    developer:
      sections:
        section:
          use-window-mouse:
            title: Инструмент useWindowMouse
            description: Тест положения курсора окна Electron
devtools:
  title: Разработчик
  pages:
    context-flow:
      title: Контекст потока
    presence-bubble:
      title: Пузырёк присутствия
      description: Управляйте пузырьком над персонажем и наблюдайте за ним в главном окне
      override:
        title: Управлять пузырьком отсюда
        description: Когда эта настройка выключена, сцена показывает пузырёк только во время хода чата.
      thinking:
        title: Размышление
        description: Показывает точки. Имеет приоритет над числом непрочитанных сообщений.
      unread:
        title: Непрочитанные сообщения
        description: Показывается как панель над головой со значком и числом.
      main-window-note: Изменения отображаются в главном окне AIRI.
    live2d-ambient-light:
      title: Окружающее освещение Live2D
      description: Настройте выборку экрана и шейдер цветного освещения Live2D
      controls:
        title: Источник света и вывод
      enabled:
        title: Окружающее освещение
        description: Применить фильтр окружающего освещения к активной модели Live2D.
      source:
        title: Источник света
        options:
          screen-capture: Захват экрана
          forced-color: Заданный цвет
      mode:
        title: Режим освещения
        options:
          window-gradient: Градиент окна
          global: Общее окружающее освещение
      forced-color:
        title: Тестовый цвет
        description: Применить этот цвет без захвата экрана.
      strength:
        title: Сила света
        description: Задайте общую силу эффекта. 1 даёт задуманный вид. Значения до 3 усиливают обтекание светом и контровой свет.
      squint:
        title: Прищуриваться при резком увеличении яркости
        description: Прищуривать глаза, если экран светлеет быстрее, чем персонаж адаптируется. При постоянной яркости глаза остаются открытыми. 0 отключает эффект.
      main-window-note: Изменения отображаются в главном окне AIRI.
      diagnostics:
        title: Диагностика захвата
        waiting: Ожидание диагностики из главного окна AIRI.
        status:
          disabled: Отключено
          starting: Запуск
          capturing: Захват
          forced-color: Заданный цвет
          error: Ошибка
        capture:
          title: Состояние захвата
          description: Проверьте выбранный дисплей, размеры захвата и координаты исключения.
          display: Дисплей и границы
          video-size: Исходное видео
          sample-size: Кадр выборки
          window-bounds: Границы окна AIRI
          excluded-region: Исключённая область
          exposure: Экспозиция экрана
          behind-luminance: Свет за персонажем
          updated: Последнее обновление
        preview:
          title: Уменьшенный захват
          description: Красный прямоугольник отмечает окно AIRI. Пунктирный прямоугольник отмечает область, покрываемую картами освещения.
          unavailable: Захваченный кадр недоступен.
        pixels:
          title: Классификация пикселей
          total: Всего
          accepted: Принятые
          excluded: Закрашенные
          transparent: Прозрачные
          see-through: Просвечивающие
        maps:
          title: Карты освещения
          window: Каждая карта покрывает окно AIRI и ещё половину окна с каждой стороны. Контур отмечает окно.
          unavailable: Данные окружения недоступны.
          target: Измеренные
          applied: Применённые после сглаживания
          surround:
            title: Карта окружения
            description: Широкое размытие экрана вокруг окна и за ним. Передаёт цвет света и направление, откуда он приходит.
          contact:
            title: Карта контакта
            description: Узкое размытие того же содержимого. Эта карта управляет обтеканием светом и контровым ободком.
      sampling:
        title: Выборка экрана
        capture-interval:
          title: Интервал захвата
          description: Задайте интервал между выборками экрана. Поток захвата работает с этой частотой.
        response-time:
          title: Время отклика
          description: Задайте скорость адаптации выбранных цветов к изменению экрана.
        sample-width:
          title: Размер выборки
          description: Задайте ширину уменьшенного кадра захвата. Более широкий кадр добавляет детализацию картам освещения. Высота следует пропорциям дисплея.
        neutral-color-weight:
          title: Вес нейтральных цветов
          description: Задайте минимальный вес цветов с низкой насыщенностью. Цветное содержимое учитывается сильнее серого.
      shader:
        title: Отклик шейдера
        dark-base:
          title: Нижний предел яркости
          description: Задайте яркость модели на чёрном экране. На белом экране модель выглядит как исходный рисунок. Тёмный экран снижает яркость к этому пределу.
        base-curve:
          title: Кривая яркости
          description: Задайте рост яркости модели от нижнего предела до исходного рисунка. При значениях выше 1 полусветлый экран держит модель ближе к нижнему пределу.
        local-share:
          title: Доля локального света
          description: Задайте, насколько яркость модели следует свету рядом с ней, а не всему дисплею. При 0 яркость одинакова при любом положении окна.
        tint:
          title: Оттенок
          description: Задайте, насколько модель перенимает оттенок экрана. При 0 на модель влияет только яркость экрана.
        color-boost:
          title: Усиление цвета при слабом свете
          description: Задайте дополнительный цвет от тусклого, но насыщенного света. Яркость сохраняется, и ни один канал не опускается ниже значения неосвещённой модели.
        wrap-intensity:
          title: Интенсивность обтекания светом
          description: Задайте силу распространения цвета фона на край модели.
        wrap-saturation:
          title: Насыщенность обтекающего света
          description: Задайте сохранение оттенка экрана в обтекающем свете. 0 добавляет белый свет той же яркости. 1 добавляет полный цвет экрана.
        backlight:
          title: Контровой свет
          description: Задайте силу света сзади персонажа, освещающего тонкий ободок по всему краю.
        wrap-diffuse:
          title: Ширина обтекания светом
          description: Задайте глубину проникновения цвета фона внутрь края модели.
        translucent-wrap:
          title: Уменьшить обтекание на полупрозрачных частях
          description: Масштабируйте обтекающий свет и ободок квадратом альфа-значения модели. Части с частичной прозрачностью уже показывают рабочий стол сквозь себя.
      preview-shader:
        title: Предпросмотр шейдера
        description: Примените настоящий шейдер к тестовой карточке с текущим окружением и настройками выше.
        window-mapping: Фильтр считает этот холст всем окном сцены, поэтому предпросмотр не является попиксельной копией сцены.
        filtered: Вывод шейдера
        unavailable: Для предпросмотра нужен WebGL, но это окно не смогло создать контекст.
        environment:
          live: Свет берётся из последнего снимка, опубликованного главным окном AIRI.
          neutral: Снимок ещё не получен, поэтому предпросмотр использует нейтральное окружение.
        regions:
          title: Области тестовой карточки
          body: Широкая часть содержит тональный переход от sRGB {low} до {high}. На нём видны яркость, контраст, цветность и запас диапазона.
          bars: Ширина полос составляет {first}, {second}, {third}, {fourth} и {fifth} пикселей. Они показывают, насколько свет проникает в тонкую форму.
          patches: Два участка нарисованы с альфа-значениями {strong} и {weak}. Именно на них влияет настройка обтекания полупрозрачных частей.
    editor:
      title: Редактор AIRI
      description: Откройте окно редактора AIRI
      button: Открыть редактор
    lag-visualizer:
      title: Лаг визуализатор
    live2d-motion:
