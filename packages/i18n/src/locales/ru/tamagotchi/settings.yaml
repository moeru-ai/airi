        timeline: Хронология
        inference: Вывод модели
      preview:
        groups:
          expression: Выражения
          offset: Смещение позиции
        values:
          squint: Прищур
          mouth-form: Форма
          mouth-open: Открытие
      joystick-label: Джойстик движения Live2D
      wave:
        toggle: Режим лодки
      instructions: Перетаскивайте джойстик или используйте стрелки для X/Y. R слегка прищуривает глаза. F прищуривает сильнее. C закрывает глаза. W/S меняет форму рта. Пробел открывает рот. A/D двигает тело по X. Q/E наклоняет голову. При отпускании клавиш положение плавно возвращается в центр.
      parameter-note: Джойстик управляет X/Y. R даёт прищур на 1/3, F на 2/3, C полностью закрывает глаза. W/S задаёт форму рта ±1. Пробел открывает рот на 1. A/D задаёт тело X ±10°. Q/E задаёт голову Z ±30°.
