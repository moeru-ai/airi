        mouth-open: Открытие рта
        input-volume-threshold: Порог громкости входа
        random-close-delay: Задержка случайного закрытия
        random-close-probability: Вероятность случайного закрытия
        actions:
          start: Начать ввод
          stop: Остановить ввод
      panels:
        direct-control: Прямое управление
