[build]
base = "/"
command = "bun run --filter @proj-airi/ui-loading-screens build && bun run --filter @proj-airi/ui-loading-screens play:build"
publish = "/packages/ui-loading-screens/playground/dist"

[build.environment]
NODE_VERSION = "24"
NODE_OPTIONS = "--max-old-space-size=4096"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false
