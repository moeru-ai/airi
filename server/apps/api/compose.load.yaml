services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: billing_load
      POSTGRES_PASSWORD: billing_load
      POSTGRES_DB: airi_billing_load_test
    ports:
      - '127.0.0.1:${BILLING_LOAD_POSTGRES_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing_load -d airi_billing_load_test']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${BILLING_LOAD_REDIS_PORT:-56379}:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
