<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AIRI</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="Open source attempt to create cyber companion.">
    <meta name="apple-mobile-web-app-title" content="AIRI" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="rgb(18,18,18)" id="themeColor" />

    <!-- Open Graph Protocol -->
    <meta property="og:title" content="AIRI">
    <meta property="og:site_name" content="AIRI">
    <meta property="og:image" content="https://airi.moeru.ai/open-graph.png">

    <meta property="og:url" content="https://airi.moeru.ai/docs/en/">

    <!-- Open Graph Protocol extension, Twitter cards -->
    <meta name="twitter:title" content="AIRI">
    <meta name="twitter:description" content="Top 1 open source attempt to create cyber companion, capable of playing Minecraft, Factorio, Balatro, etc. .">
    <meta name="twitter:image" content="https://airi.moeru.ai/open-graph.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="Moeru AI">
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'light' || (prefersDark && setting !== 'dark'))
          document.querySelector('#themeColor')?.setAttribute('content', 'rgb(255,255,255)')
      })()
    </script>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)

        const savedHue = localStorage.getItem('settings/theme/colors/hue')
        const hue = Number(savedHue)
        if (savedHue !== null && Number.isFinite(hue) && hue >= 0 && hue <= 360)
          document.documentElement.style.setProperty('--chromatic-hue', hue.toString())
      })()
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: max(calc(env(safe-area-inset-top) + 48px), calc(40vh - 82px)) 24px calc(env(safe-area-inset-bottom) + clamp(48px, 8vh, 96px));
        background: #fff;
        color: #262626;
        font-family: "Comfortaa Variable", "Comfortaa", ui-sans-serif, system-ui, sans-serif;
      }

      #boot-splash .brand { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; gap: 20px; }
      #boot-splash img { width: 96px; height: 96px; filter: hue-rotate(calc(var(--chromatic-hue, 220.44) * 1deg)); }
      #boot-splash strong { font-size: 32px; font-weight: 700; letter-spacing: 0.07em; padding-left: 0.07em; -webkit-text-stroke: 0.5px currentColor; }
      #boot-splash .status { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; width: min(220px, 60vw); height: 44px; }
      #boot-splash .track-space { width: 48px; height: 3px; margin-top: 28px; }
      #app:not(:empty) + #boot-splash { display: none; }
      html.dark #boot-splash { background: #171717; color: #f5f5f5; }
    </style>
    <noscript><style>#boot-splash { display: none; }</style></noscript>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <div id="boot-splash" role="status" aria-busy="true">
      <div class="brand">
        <img src="/favicon.svg" alt="" />
        <strong>AIRI</strong>
      </div>
      <div class="status"><span class="track-space" aria-hidden="true"></span></div>
    </div>
    <script src="/assets/js/CubismSdkForWeb-5-r.3/Core/live2dcubismcore.min.js"></script>
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
