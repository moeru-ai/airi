; Android settings follow Kirie's examples/eventa-csharp/export_presets.cfg.
[preset.0]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="package.json,src-web/src/*,src-web/node_modules/*,tests/*,android/*"
export_path="dist/kirie/android/debug.apk"
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.0.0"
package/unique_name="ai.moeru.airi.kirie"
package/name="AIRI"
package/signed=true
permissions/internet=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
kirie/debug/enable_web_inspector=false
kirie/debug/allow_tls_bypass=false
