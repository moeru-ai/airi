name: Deploy to server-dev

run-name: Deploy ${{ inputs.branch }} to server-dev (@${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of this repository to deploy'
        required: true
        type: string
      reset_database:
        description: 'Reset the server-dev Neon branch to its parent before the deploy'
        required: true
        type: boolean
        default: true

# The dev environment is one shared slot, so runs do not overlap. A run holds
# the group until Railway finishes its deploys. GitHub keeps one pending run
# and cancels an older pending run, so the latest request is the next deploy.
concurrency:
  group: server-dev
  cancel-in-progress: false

permissions:
  contents: read
  # Starts the "Cloudflare Workers (server-dev)" workflow.
  actions: write

jobs:
  deploy:
    name: Deploy - server-dev
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    environment: ServerDev

    env:
      DEPLOY_BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # Stop before the database reset if no deploy can follow it.
      - name: Check the branch
        run: |
          deploy_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEPLOY_BRANCH}" --jq '.commit.sha')
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve ${DEPLOY_BRANCH} to a commit." >&2
            exit 1
          fi
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Record the selected source
        run: |
          jq --null-input \
            --arg branch "$DEPLOY_BRANCH" \
            --arg commit_sha "$DEPLOY_SHA" \
            --arg workflow_sha "$GITHUB_SHA" \
            '{ branch: $branch, commitSha: $commit_sha, workflowSha: $workflow_sha }' \
            > "$RUNNER_TEMP/server-dev-source.json"

      - name: Upload the selected source
        uses: actions/upload-artifact@v7
        with:
          name: server-dev-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-dev-source.json
          retention-days: 1

      - uses: actions/checkout@v6

      - name: Install the pinned Railway CLI
        run: |
          archive="$RUNNER_TEMP/railway-v5.67.0.tar.gz"
          bin_dir="$RUNNER_TEMP/railway-cli"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/railwayapp/cli/releases/download/v5.67.0/railway-v5.67.0-x86_64-unknown-linux-musl.tar.gz
          echo "ec637e85bd74e56959639ae6cb2343fbe529d846a4df184a297f688585095121  $archive" \
            | sha256sum --check --strict
          mkdir --parents "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Link the Railway dev environment
        run: railway link --project Server --environment dev
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_DEV_WORKSPACE_TOKEN }}

      # Push-driven deploys bypass this workflow's database reset and commit
      # pin. Keep them disabled while this workflow owns the shared slot.
      - name: Disable Railway autodeploys
        run: bash .github/scripts/deploy-server-dev.sh disable-autodeploys
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_DEV_WORKSPACE_TOKEN }}

      # Select the new source before the reset. Then wait for deployments that
      # the old source started outside this workflow's concurrency group.
      - name: Select the Railway source branch
        run: bash .github/scripts/deploy-server-dev.sh select-branch
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_DEV_WORKSPACE_TOKEN }}

      # The API runs migrations on startup, and the Drizzle migrator only
      # applies migrations newer than the last applied one. A database that
      # another branch migrated makes it skip older migrations of this branch
      # without an error. Reset first so that the new deploy migrates a clean
      # baseline.
      - name: Reset the Neon branch
        if: inputs.reset_database
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ vars.NEON_SERVER_DEV_BRANCH }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      # `redeploy --from-source` also covers a run that keeps the same branch.
      # The services must restart there to migrate the reset database.
      #
      # Each deployment finishes before the next deployment starts. This order
      # keeps a failed command from leaving an untracked deployment running.
      - name: Deploy the Railway dev services from the branch
        run: bash .github/scripts/deploy-server-dev.sh deploy-services
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_DEV_WORKSPACE_TOKEN }}

      - name: Deploy the frontend
        run: bash .github/scripts/deploy-server-dev.sh deploy-frontend

      - name: Summary
        env:
          RESET_DATABASE: ${{ inputs.reset_database }}
        run: |
          {
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`${DEPLOY_BRANCH}\` |"
            echo "| Commit | \`${DEPLOY_SHA}\` |"
            echo "| Database reset | ${RESET_DATABASE} |"
            echo "| Actor | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
