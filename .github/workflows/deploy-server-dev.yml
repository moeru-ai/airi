name: Deploy to server-dev

run-name: Deploy ${{ inputs.branch }} to server-dev (@${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch of this repository to deploy'
        required: true
        type: string
      reset_database:
        description: 'Reset the server-dev Neon branch to its parent before the deploy'
        required: true
        type: boolean
        default: true

# The dev environment is one shared slot, so runs do not overlap. A run holds
# the group until Railway finishes its deploys. GitHub keeps one pending run
# and cancels an older pending run, so the latest request is the next deploy.
concurrency:
  group: server-dev
  cancel-in-progress: false

permissions:
  contents: read
  # Starts the "Cloudflare Workers (server-dev)" workflow.
  actions: write

jobs:
  deploy:
    name: Deploy - server-dev
    runs-on: ubuntu-latest

    env:
      DEPLOY_BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}
      # A project token for the Railway dev environment. It selects the
      # project and the environment for each railway command.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEV_TOKEN }}

    steps:
      - run: npm install --global @railway/cli@5

      - name: Probe the token
        run: |
          railway --version
          echo "== api projectToken"
          curl -sS https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'content-type: application/json' \
            -d '{"query":"{projectToken{projectId environmentId}}"}' | jq -c '{ok: (.data.projectToken != null), errors: [.errors[]?.message]}'
          echo "token length: ${#RAILWAY_TOKEN}"
          probe() {
            if out=$(railway "$@" 2>&1); then echo "OK   railway $*"; else echo "FAIL railway $* :: $(echo "$out" | head -c 160 | tr '\n' ' ')"; fi
          }
          probe status --json
          probe service list --json
          probe service status --service ts-api --json
          probe service status --service ts-api --environment dev --json
          probe deployment list --service ts-api --limit 1 --json
