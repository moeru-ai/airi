name: Release VSCE & OVSX

on:
  push:
    tags:
      - '@proj-airi/airi-plugin-vscode@v*'
      - 'v*'

permissions:
  contents: read

jobs:
  release-vsix:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          # registry-url required. Learn more at
          # https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run --filter @proj-airi/airi-plugin-vscode build
      - run: bun run --filter vscode-airi build
      - run: bun run publish
        working-directory: ./integrations/vscode/vscode-airi
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
