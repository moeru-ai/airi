name: Release Tamagotchi Kirie (artifacts only)

permissions:
  contents: read

on:
  push:
    branches:
      - ci/tamagotchi-kirie-artifacts
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: release-tamagotchi-kirie-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  # Not VERSION: MSBuild picks it up as $(Version) (NU1105).
  KIRIE_VERSION: ''

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows-x64
            preset: Windows Desktop
            output: AIRI-Kirie.exe
            experimental: false
          - name: macOS universal
            os: macos-26
            target: macos-universal
            preset: macOS
            output: AIRI-Kirie.app
            experimental: false
          - name: Linux x64
            os: ubuntu-latest
            target: linux-x64
            preset: Linux/X11
            output: AIRI-Kirie
            experimental: false
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: linux-arm64
            preset: Linux/X11 arm64
            output: AIRI-Kirie
            experimental: true
          - name: Android
            os: ubuntu-latest
            target: android
            experimental: true
          - name: iOS (unsigned)
            os: macos-26
            target: ios
            experimental: true
    defaults:
      run:
        shell: bash
        working-directory: apps/stage-tamagotchi-kirie
    env:
      ARTIFACT_NAME: AIRI-Kirie-${{ matrix.target }}
    steps:
      - if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: false

      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3
        with:
          working_directory: apps/stage-tamagotchi-kirie
          install_args: nodejs pnpm java ${{ runner.os != 'Windows' && 'godot' || '' }}
          cache: true

      - if: runner.os == 'Windows'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - if: runner.os == 'Windows'
        run: echo "GODOT=$(cygpath -w "$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_win64/Godot_v${GODOT_VERSION}-stable_mono_win64.exe")" >> "$GITHUB_ENV"

      - if: runner.os != 'Windows'
        run: |
          dir="$HOME/.local/share/godot/export_templates"
          [ "$RUNNER_OS" = macOS ] && dir="$HOME/Library/Application Support/Godot/export_templates"
          curl -fsSL -o /tmp/t.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q /tmp/t.tpz -d /tmp/t && mkdir -p "$dir" && mv /tmp/t/templates "$dir/${GODOT_VERSION}.stable.mono"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - if: matrix.target == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - if: runner.os == 'macOS'
        run: brew install pkg-config cairo pango jpeg giflib librsvg || true

      - run: |
          echo "KIRIE_VERSION=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          mise x -- pnpm install --frozen-lockfile
          mise x -- pnpm kirie doctor --fix plugin:core
          mise x -- pnpm kirie doctor --fix plugin:notifications
          mise x -- pnpm run build
          "${GODOT:-godot}" --headless --import || true
          "${GODOT:-godot}" --headless --import || true

      - if: matrix.preset
        run: mkdir -p "dist/ci/$ARTIFACT_NAME" && "${GODOT:-godot}" --headless --export-release "${{ matrix.preset }}" "dist/ci/$ARTIFACT_NAME/${{ matrix.output }}"

      - if: matrix.target == 'android'
        run: mise x -- pnpm kirie export android -o "dist/ci/$ARTIFACT_NAME/AIRI-Kirie.apk"

      - if: matrix.target == 'ios'
        run: |
          sed -i '' 's/^application\/app_store_team_id=""/application\/app_store_team_id="0000000000"/' export_presets.cfg
          mkdir -p "dist/ci/$ARTIFACT_NAME" && godot --headless --export-debug iOS "dist/ci/$ARTIFACT_NAME/AIRI-Kirie.xcodeproj"

      - run: cd dist/ci && if command -v zip >/dev/null; then zip -qry "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"; else 7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ env.KIRIE_VERSION }}
          path: apps/stage-tamagotchi-kirie/dist/ci/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
