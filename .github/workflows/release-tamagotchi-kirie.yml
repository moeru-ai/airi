# Release Tamagotchi Kirie — CI artifacts only
#
# Builds/exports the Godot Mono + Kirie host for desktop and mobile, then uploads
# GitHub Actions artifacts. Never publishes GitHub Release assets (no softprops /
# action-gh-release). Packaging remains experimental; unsigned / ad-hoc signing
# is intentional for this first-pass workflow.
#
# Triggers:
#   - workflow_dispatch: manual (build_only skips upload; tag overrides version)
#   - schedule: nightly at 02:00 UTC (offset from Electron's midnight cron)
#
# Versioning (mirrors Electron nightly naming):
#   - schedule / manual without tag → nightly-YYYYMMDD-<sha7>
#   - manual with tag              → tag with leading "v" stripped
#
# Toolchain:
#   - Root .tool-versions → nodejs, pnpm (via jdx/mise-action)
#   - .NET SDK → actions/setup-dotnet (same as repo ci.yml; mise dotnet has
#     been associated with opaque MSB4181 RestoreTask failures on GHA)
#   - apps/stage-tamagotchi-kirie/mise.toml → godot + java (via mise)
#   - Windows Godot: chickensoft-games/setup-godot (mise godot is unreliable there)
#   - Android SDK packages: android-actions/setup-android (mise does not install these)
#   - Godot export templates: installed separately when using mise godot (plugin
#     does not ship templates); chickensoft installs them on Windows.

name: Release Tamagotchi Kirie (artifacts only)

permissions:
  contents: read
  actions: write

env:
  PRODUCT_NAME: 'AIRI-Kirie'
  GODOT_VERSION: '4.7.2'
  APP_DIR: apps/stage-tamagotchi-kirie
  # Not named VERSION: MSBuild imports env vars as properties, and a
  # nightly-* string in $(Version) breaks NuGet restore (NU1105).
  KIRIE_VERSION: ''
  ARTIFACT_NAME: ''
  MISE_EXEC_AUTO_INSTALL: 'false'
  MISE_NOT_FOUND_AUTO_INSTALL: 'false'
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: 'bash -c'

on:
  # Temporary: allow running from the PR branch before the workflow lands on main
  # (workflow_dispatch only works for workflows on the default branch).
  push:
    branches:
      - ci/tamagotchi-kirie-artifacts
  workflow_dispatch:
    inputs:
      build_only:
        description: Build/export only (skip artifact upload)
        required: false
        default: false
        type: boolean
      tag:
        description: Version override (e.g. v0.12.0). Empty → nightly-YYYYMMDD-<sha7>
        required: false
        type: string
      platform:
        description: Platform
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
          - android
          - ios
        default: all
  schedule:
    # Electron release-tamagotchi.yml uses 0 0 * * *; keep this offset.
    - cron: '0 2 * * *'

concurrency:
  group: release-tamagotchi-kirie-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # Experimental platforms (esp. iOS unsigned) may flake; fail-fast false keeps others green.
    continue-on-error: ${{ matrix.skip || matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            arch: x64
            preset: Windows Desktop
            export_mode: release
            experimental: false
            skip: ${{ inputs.platform != '' && inputs.platform != 'all' && inputs.platform != 'windows' }}

          - name: macOS universal
            os: macos-26
            platform: macos
            arch: universal
            preset: macOS
            export_mode: release
            experimental: false
            skip: ${{ inputs.platform != '' && inputs.platform != 'all' && inputs.platform != 'macos' }}

          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            preset: Linux/X11
            export_mode: release
            experimental: false
            skip: ${{ inputs.platform != '' && inputs.platform != 'all' && inputs.platform != 'linux' }}

          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            preset: Linux/X11 arm64
            export_mode: release
            experimental: true
            skip: ${{ inputs.platform != '' && inputs.platform != 'all' && inputs.platform != 'linux' }}

          - name: Android
            os: ubuntu-latest
            platform: android
            arch: arm64
            preset: Android
            export_mode: debug
            experimental: true
            skip: ${{ inputs.platform != '' && inputs.platform != 'all' && inputs.platform != 'android' }}

          - name: iOS (Xcode project, unsigned)
            os: macos-26
            platform: ios
            arch: arm64
            preset: iOS
            export_mode: debug
            experimental: true
            skip: ${{ inputs.platform != '' && inputs.platform != 'all' && inputs.platform != 'ios' }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Skip the build (fail fast for filtered platforms)
        if: ${{ matrix.skip }}
        run: |
          echo "Skipping ${{ matrix.name }} (platform filter)."
          echo "This fails the job on purpose when not building for all — expected."
          exit 1

      - name: Free Disk Space
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Keep the runner Android SDK root — setup-android needs /usr/local/lib/android.
          android: false

      - uses: actions/checkout@v6

      # Root .tool-versions (nodejs/pnpm/dotnet) + app mise.toml (godot/java).
      # Skip mise godot on Windows — use chickensoft-games/setup-godot instead
      # (same pattern as gd-kirie desktop CI).
      # NOTICE: pnpm 11 has no working standalone executable for Intel macOS
      # (https://github.com/pnpm/pnpm/issues/11423). This matrix has no Intel
      # macOS runner; if one is added, install pnpm via npm against mise node
      # instead of the mise pnpm binary until pnpm 12+.
      - name: Install toolchain (mise)
        if: runner.os != 'Windows'
        uses: jdx/mise-action@v3
        with:
          working_directory: ${{ env.APP_DIR }}
          install: true
          install_args: nodejs pnpm java godot
          cache: true

      - name: Install toolchain (mise, no Godot)
        if: runner.os == 'Windows'
        uses: jdx/mise-action@v3
        with:
          working_directory: ${{ env.APP_DIR }}
          install: true
          install_args: nodejs pnpm java
          cache: true

      - name: Setup Godot Mono + export templates (Windows)
        if: runner.os == 'Windows'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Select Windows Godot executable
        if: runner.os == 'Windows'
        run: |
          godot_exe="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_win64/Godot_v${GODOT_VERSION}-stable_mono_win64.exe"
          test -f "$godot_exe"
          echo "GODOT=$(cygpath -w "$godot_exe")" >> "$GITHUB_ENV"

      # vfox-godot installs the editor only; export needs official mono templates.
      - name: Install Godot export templates (mise Godot)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          VERSION="${{ env.GODOT_VERSION }}"
          CHANNEL=stable
          VARIANT=mono
          TEMPLATE_DIR_NAME="${VERSION}.${CHANNEL}.${VARIANT}"
          case "${RUNNER_OS}" in
            macOS)
              DEST="${HOME}/Library/Application Support/Godot/export_templates/${TEMPLATE_DIR_NAME}"
              ;;
            *)
              DEST="${HOME}/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}"
              ;;
          esac
          if [ -d "$DEST" ] && [ -n "$(ls -A "$DEST" 2>/dev/null || true)" ]; then
            echo "Export templates already present at $DEST"
            exit 0
          fi
          URL="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-${CHANNEL}/Godot_v${VERSION}-${CHANNEL}_${VARIANT}_export_templates.tpz"
          TMP="$(mktemp -d)"
          echo "Downloading $URL"
          curl -fsSL -o "$TMP/templates.tpz" "$URL"
          mkdir -p "$TMP/extracted"
          unzip -q "$TMP/templates.tpz" -d "$TMP/extracted"
          mkdir -p "$(dirname "$DEST")"
          rm -rf "$DEST"
          mv "$TMP/extracted/templates" "$DEST"
          echo "Installed export templates to $DEST"
          ls -la "$DEST" | head

      # Prefer official setup-dotnet over mise's dotnet-root for NuGet restore reliability.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;36.0.0

      - name: Install macOS System Dependencies for node-canvas
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config cairo pango jpeg giflib librsvg || true

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - run: mise x -- pnpm install --frozen-lockfile

      - run: mise x -- pnpm run build:packages

      - name: Resolve version and artifact name
        working-directory: ${{ env.APP_DIR }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG_ARGS=()
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG_ARGS=(--tag "$INPUT_TAG")
          fi
          KIRIE_VERSION="$(mise x -- node scripts/artifacts-version.mjs --get-version "${TAG_ARGS[@]}")"
          ARTIFACT_NAME="$(mise x -- node scripts/artifacts-version.mjs --get-artifact-name --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' "${TAG_ARGS[@]}")"
          echo "KIRIE_VERSION=$KIRIE_VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "Resolved KIRIE_VERSION=$KIRIE_VERSION ARTIFACT_NAME=$ARTIFACT_NAME"

      - name: Install Kirie plugins (doctor)
        working-directory: ${{ env.APP_DIR }}
        run: |
          mise x -- pnpm kirie doctor --fix plugin:core
          mise x -- pnpm kirie doctor --fix plugin:notifications

      # Official split (gd-kirie docs/addon-release.md + README Installation):
      # `kirie doctor --fix plugin:core` installs the *npm-bundled* addon (GDScript
      # + desktop CEF), which intentionally omits Android AAR / iOS xcframeworks.
      # Those native artifacts ship only in the GitHub Release `kirie-addon.zip`
      # (manual install path). Overlay that zip's libraries/ios onto the doctor
      # install so CI matches a local machine that extracted the release zip.
      - name: Overlay Kirie native libraries (AAR / xcframework)
        if: matrix.platform == 'android' || matrix.platform == 'ios'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          KIRIE_VER="$(node -p "require('./package.json').dependencies.kirie")"
          URL="https://github.com/gd-kirie/gd-kirie/releases/download/v${KIRIE_VER}/kirie-addon.zip"
          TMP="$(mktemp -d)"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o "$TMP/kirie-addon.zip"
          case "$KIRIE_VER" in
            0.15.0)
              echo "6b2acad54f7f215ec45a761c21e70d14237d63a915ad238bb4fe1f52312274fc  $TMP/kirie-addon.zip" | sha256sum -c -
              ;;
            *)
              echo "WARN: no pinned sha256 for kirie $KIRIE_VER; proceeding without checksum"
              ;;
          esac
          # Zip root is addons/kirie/... — merge into the doctor-installed addon.
          unzip -o "$TMP/kirie-addon.zip" \
            "addons/kirie/libraries/*" \
            "addons/kirie/ios/*" \
            -d .
          if [ "${{ matrix.platform }}" = "android" ]; then
            test -f addons/kirie/libraries/android/Kirie-release.aar
            ls -la addons/kirie/libraries/android/
          fi
          if [ "${{ matrix.platform }}" = "ios" ]; then
            test -d addons/kirie/ios/Kirie.release.xcframework
            ls -la addons/kirie/ios/
          fi

      # Surface NuGet/MSB4181 detail that `kirie build` otherwise swallows.
      - name: Dotnet restore (verbose)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          echo "dotnet=$(command -v dotnet)"
          dotnet --info
          dotnet nuget list source || true
          rm -rf .godot/mono/temp/obj obj bin
          if ! dotnet restore StageTamagotchiKirie.csproj --force --force-evaluate --verbosity detailed; then
            echo '----- project.assets.json -----'
            assets='.godot/mono/temp/obj/project.assets.json'
            if [ -f "$assets" ]; then
              python3 -c 'import json,sys; p=sys.argv[1]; data=json.load(open(p,encoding="utf-8-sig")); print("success=", data.get("success")); print("logs=", json.dumps(data.get("logs"), indent=2)[:8000]); libs=data.get("libraries") or {}; print("libraries=", sorted(libs)[:80], "count=", len(libs))' "$assets" || sed -n '1,200p' "$assets"
            else
              echo "(no $assets)"
            fi
            echo '----- nuget cache gdkirie -----'
            ls -la "${HOME}/.nuget/packages/gdkirie.platform/" 2>/dev/null || true
            exit 1
          fi

      - name: Build web + C# (kirie build)
        working-directory: ${{ env.APP_DIR }}
        run: mise x -- pnpm run build

      - name: Import Godot project
        working-directory: ${{ env.APP_DIR }}
        timeout-minutes: 10
        run: |
          godot_command="${GODOT:-}"
          if [ -z "$godot_command" ]; then
            godot_command="$(mise which godot)"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            godot_command="$(cygpath -u "$godot_command")"
          fi
          "$godot_command" --headless --import || true
          # Second pass after first-time addon registration
          "$godot_command" --headless --import || true

      - name: Export (desktop — Godot preset)
        if: matrix.platform == 'windows' || matrix.platform == 'macos' || matrix.platform == 'linux'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          godot_command="${GODOT:-}"
          if [ -z "$godot_command" ]; then
            godot_command="$(mise which godot)"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            godot_command="$(cygpath -u "$godot_command")"
          fi
          OUT_DIR="dist/kirie/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$OUT_DIR"
          case "${{ matrix.platform }}" in
            windows)
              OUT_FILE="$OUT_DIR/AIRI-Kirie.exe"
              ;;
            macos)
              OUT_FILE="$OUT_DIR/AIRI-Kirie.app"
              ;;
            linux)
              OUT_FILE="$OUT_DIR/AIRI-Kirie"
              ;;
          esac
          EXPORT_FLAG="--export-release"
          if [ "${{ matrix.export_mode }}" = "debug" ]; then
            EXPORT_FLAG="--export-debug"
          fi
          echo "Exporting preset '${{ matrix.preset }}' → $OUT_FILE"
          "$godot_command" --headless $EXPORT_FLAG "${{ matrix.preset }}" "$OUT_FILE"
          # Stage into a named bundle directory for upload
          BUNDLE_DIR="bundle/${{ env.ARTIFACT_NAME }}"
          mkdir -p "$BUNDLE_DIR"
          # Collect export outputs (exe+pck, .app, linux binary+pck, etc.)
          cp -a "$OUT_DIR"/. "$BUNDLE_DIR"/
          # Zip for a single uploadable archive on all OSes
          (
            cd bundle
            if command -v zip >/dev/null 2>&1; then
              zip -r "${{ env.ARTIFACT_NAME }}.zip" "${{ env.ARTIFACT_NAME }}"
            else
              powershell -NoProfile -Command "Compress-Archive -Path '${{ env.ARTIFACT_NAME }}' -DestinationPath '${{ env.ARTIFACT_NAME }}.zip' -Force"
            fi
          )
          ls -la bundle/

      - name: Export (Android — kirie CLI)
        if: matrix.platform == 'android'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # kirie 0.15 uses subcommands: `kirie export android` (not --platform).
          # Default mode is debug (unsigned debug keystore) — fine for CI artifacts.
          mise x -- pnpm kirie export android --no-build
          BUNDLE_DIR="bundle/${{ env.ARTIFACT_NAME }}"
          mkdir -p "$BUNDLE_DIR"
          # Default kirie output: dist/kirie/android/debug.apk (or release.apk)
          found="$(find dist/kirie/android -type f \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null | head -n 1 || true)"
          if [ -z "$found" ]; then
            echo "No APK/AAB under dist/kirie/android; listing dist:"
            find dist -type f | head -n 100 || true
            exit 1
          fi
          cp -a "$found" "$BUNDLE_DIR/${{ env.ARTIFACT_NAME }}.apk"
          (
            cd bundle
            zip -r "${{ env.ARTIFACT_NAME }}.zip" "${{ env.ARTIFACT_NAME }}"
          )
          ls -la bundle/

      - name: Export (iOS — Godot Xcode project only / unsigned)
        if: matrix.platform == 'ios'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          # `kirie export ios` also runs xcodebuild for an installable .app and needs
          # signing. For CI artifacts we call Godot directly; export_presets.cfg sets
          # application/export_project_only=true and leaves app_store_team_id empty.
          godot_command="${GODOT:-}"
          if [ -z "$godot_command" ]; then
            godot_command="$(mise which godot)"
          fi
          OUT_DIR="dist/kirie/ios"
          mkdir -p "$OUT_DIR"
          OUT_FILE="$OUT_DIR/debug.xcodeproj"
          "$godot_command" --headless --export-debug "iOS" "$OUT_FILE"
          BUNDLE_DIR="bundle/${{ env.ARTIFACT_NAME }}"
          mkdir -p "$BUNDLE_DIR"
          # Godot writes the xcodeproj and sibling export files under OUT_DIR
          cp -a "$OUT_DIR"/. "$BUNDLE_DIR"/
          (
            cd bundle
            zip -r "${{ env.ARTIFACT_NAME }}.zip" "${{ env.ARTIFACT_NAME }}"
          )
          ls -la bundle/

      - name: Upload CI artifact
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.build_only) }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APP_DIR }}/bundle/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
