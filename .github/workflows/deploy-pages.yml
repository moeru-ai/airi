name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          install-args: --frozen-lockfile
      - name: Build stage-web for GitHub Pages
        env:
          STAGE_WEB_BASE: /airi-vm/
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -F @proj-airi/stage-web run build
      - name: Add SPA fallback for GitHub Pages
        run: cp apps/stage-web/dist/index.html apps/stage-web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/stage-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment