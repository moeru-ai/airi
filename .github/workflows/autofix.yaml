name: autofix.ci

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    # This workflow has no required checks, so a filter cannot block a pull request.
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '**/docs/**/*.md'
      - '**/README*.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - 'DESIGN.md'
      - 'LICENSE'
  push:
    branches: [crowdin]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Depth 2 includes the parents of the pull request merge commit.
          fetch-depth: 2

      - uses: ./.github/actions/setup-workspace

      # An unchanged lockfile gives dedupe no work, and a run can only add unrelated changes.
      - id: manifests
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- pnpm-lock.yaml pnpm-workspace.yaml '**/package.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.manifests.outputs.changed != 'false'
        run: pnpm prune && pnpm dedupe

      # The Lint job in ci.yml saves this cache.
      - name: Restore ESLint cache
        uses: actions/cache/restore@v5
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts', 'uno.config.ts', 'eslint-suppressions.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts', 'uno.config.ts', 'eslint-suppressions.json') }}-

      # NOTICE:
      # These commands replace `pnpm run lint:fix` to pass --cache-strategy content.
      # moeru-lint uses the default mtime strategy, and a new checkout changes each mtime.
      # Source: node_modules/@moeru/eslint-config/src/moeru-lint.js
      # Remove these commands when moeru-lint accepts a cache strategy.
      - run: pnpm exec oxlint --no-error-on-unmatched-pattern --fix .
      - run: pnpm exec eslint --fix --cache --cache-strategy content --concurrency auto .

      - run: docker run -v `pwd`:`pwd` -w `pwd` ghcr.io/realm/swiftlint:latest --fix
        working-directory: ./apps/stage-pocket

      # Writes the current i18n diagnostics into `.x18n/check-baseline.json`.
      # The update drops the diagnostics that no longer occur, and adds the new warnings.
      # A new error skips the update, so the baseline never hides it. The Lint job in ci.yml reports it.
      - name: Update the i18n baseline
        run: |
          if pnpm exec x18n check > /dev/null; then
            pnpm exec x18n check --update-baseline
          fi

      # - name: AutoCorrect
      #   uses: huacnlee/autocorrect-action@main
      #   with:
      #     args: --fix

      - uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8 # v1.3.3
