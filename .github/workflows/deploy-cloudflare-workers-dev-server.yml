name: Cloudflare Workers (server-dev)

# The parent starts this workflow from its own ref and passes the source branch.
# This keeps the dispatch inputs available for branches created earlier.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of this repository to deploy
        required: true
        type: string
      commit_sha:
        description: Commit to deploy from the selected branch
        required: true
        type: string
      parent_run_id:
        description: Parent deployment workflow run that selected the source
        required: true
        type: string
      dispatch_token:
        description: Unique token from the parent deployment workflow
        required: false
        type: string

run-name: ${{ inputs.dispatch_token && format('Deploy server-dev frontend ({0})', inputs.dispatch_token) || 'Deploy server-dev frontend' }}

# All runs deploy to the same preview alias, whatever branch they build.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  validate_source:
    name: Validate selected source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Validate the parent workflow run
        id: parent
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
        run: |
          parent_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")
          if ! jq --exit-status '
            .event == "workflow_dispatch"
            and .status == "in_progress"
            and .path == ".github/workflows/deploy-server-dev.yml"
            and .head_branch == .repository.default_branch
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$parent_run" > /dev/null; then
            echo "Run ${PARENT_RUN_ID} is not an active server-dev deployment." >&2
            exit 1
          fi
          run_attempt=$(jq --exit-status --raw-output '.run_attempt' <<< "$parent_run")
          workflow_sha=$(jq --exit-status --raw-output '.head_sha' <<< "$parent_run")
          echo "artifact_name=server-dev-source-${PARENT_RUN_ID}-${run_attempt}" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.parent.outputs.artifact_name }}
          path: ${{ runner.temp }}/server-dev-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}

      - name: Bind the commit to the selected branch
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.branch }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ steps.parent.outputs.workflow_sha }}
        run: |
          if ! jq --exit-status \
            --arg branch "$SOURCE_BRANCH" \
            --arg commit_sha "$SOURCE_SHA" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            '.branch == $branch and .commitSha == $commit_sha and .workflowSha == $workflow_sha' \
            "$RUNNER_TEMP/server-dev-source/server-dev-source.json" > /dev/null; then
            echo "Commit ${SOURCE_SHA} was not selected for ${SOURCE_BRANCH} by the parent run." >&2
            exit 1
          fi
          echo "commit_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  deploy-stage-web:
    name: Deploy - stage-web (server-dev)
    needs: validate_source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    environment:
      name: ServerDev
      url: ${{ steps.preview-urls.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}
      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false
      - run: pnpm i -g wrangler@4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - name: Build stage-web
        run: |
          pnpm -F @proj-airi/stage-web run build

          pnpm -F @proj-airi/stage-ui run story:build
          mv ./packages/stage-ui/.histoire/dist ./apps/stage-web/dist/ui
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          WARP_DRIVE_PUBLIC_BASE: ${{ secrets.WARP_DRIVE_PUBLIC_BASE }}
          VITE_SERVER_URL: 'https://api-dev.airi.build'
          VITE_REVENUECAT_WEB_KEY: ${{ vars.VITE_REVENUECAT_WEB_KEY }}

      - name: Wrangler Upload
        id: wrangler-versions-upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload -c ./apps/stage-web/wrangler.toml --preview-alias server-dev --message "GitHub Actions uploaded server-dev branch preview" --tag v0.0.1-server-dev
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare preview URL
        id: preview-urls
        run: |
          deployment_url="${{ steps.wrangler-versions-upload.outputs.deployment-url }}"
          if [ -z "$deployment_url" ]; then
            echo "Deployment URL from wrangler upload is empty." >&2
            exit 1
          fi

          host_without_scheme="${deployment_url#https://}"
          host_without_scheme="${host_without_scheme#http://}"
          preview_url="https://server-dev-${host_without_scheme#*-}"

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

  deploy-auth-ui:
    name: Deploy - ui-server-auth (server-dev)
    needs: validate_source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    environment:
      name: AuthServerDev
      url: https://server-dev.airi-server-auth.pages.dev/ui/

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate_source.outputs.commit_sha }}
      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-auth-${{ inputs.commit_sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-auth-
            ${{ runner.os }}-turbo-
      - uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false
      - run: pnpm i -g wrangler@4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - name: Build ui-server-auth
        run: pnpm -F @proj-airi/ui-server-auth run build
        env:
          VITE_SERVER_URL: 'https://api-dev.airi.build'
          VITE_WEB_APP_URL: 'https://airi.moeru.ai/'

      - name: Wrangler Pages Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./apps/ui-server-auth/dist --project-name=airi-accounts-ui --branch=server-dev
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print preview URL
        run: |
          echo "Preview URL: https://server-dev.airi-server-auth.pages.dev/ui/"
